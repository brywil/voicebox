<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- interactive-widget=resizes-content is the whole fix for the on-screen
     keyboard. The default, resizes-visual, shrinks only the VISUAL viewport:
     100dvh stays full-screen-height, the keyboard covers the bottom, and the
     browser scrolls the entire page up to reveal the focused input -- taking the
     header and the conversation with it. resizes-content shrinks the layout
     viewport instead, so the flex column simply re-lays out around the keyboard
     and nothing scrolls away. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>voicebox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13; --panel: #151922; --edge: #262c38;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #57c7a8; --accent-dim: #2f6e5e;
    --rec: #e05555; --warn: #e0a955;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Pull-to-refresh is a property of the ROOT scroller. #log already sets
     overscroll-behavior, but that only stops chaining OUT of #log -- a swipe starting on the
     header, the footer, or any gap between them reaches the root untouched and refreshes the
     page, losing the conversation. On a phone that gesture is one mis-swipe from a scroll.
     Sessions now survive a refresh, but not losing it in the first place is still better. */
  html { overscroll-behavior-y: none; }
  body {
    background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column;
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
    /* The page itself never scrolls; only #log does. Without this a long
       conversation scrolls the header and footer away instead of the history. */
    overflow: hidden;
  }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #crumb {
    flex: 1; min-width: 0; font: 12px/1.4 var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #gear { font-size: 17px; line-height: 1; padding: 6px 11px; }

  /* Settings live in a panel because there are now thirteen of them; a single
     bar of controls had stopped being scannable and did not fit a narrow window
     at all. */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 10;
    background: var(--panel); border-left: 1px solid var(--edge);
    overflow-y: auto; padding-bottom: 24px;
    box-shadow: -18px 0 40px rgba(0,0,0,.45);
  }
  #panel[hidden], #scrim[hidden] { display: none; }
  .phead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--edge);
    position: sticky; top: 0; background: var(--panel); font-weight: 600;
  }
  #panel section { padding: 14px 16px; border-bottom: 1px solid var(--edge); }
  #panel h2 {
    font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 11px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .row > span:first-child { flex: 0 0 96px; font-size: 13px; color: var(--muted); }
  .row select { flex: 1; min-width: 0; }
  .row .rate { flex: 1; display: flex; align-items: center; gap: 8px; }
  .row .rate input { flex: 1; }
  #rateVal { font: 12px var(--mono); min-width: 3.2em; }
  #panel .chk { margin-bottom: 8px; align-items: flex-start; line-height: 1.35; }
  #panel .chk input { margin-top: 2px; }
  #clear { width: 100%; }
  select, button, input {
    background: #1b212c; color: var(--text); border: 1px solid var(--edge);
    border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 13px;
  }
  select:hover, button:hover { border-color: #3a4356; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  label.chk { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  input[type=range] { accent-color: var(--accent); padding: 0; }
  /* min-height:0 is load-bearing: a flex item defaults to min-height:auto and
     will not shrink below its content, so without it a long conversation grows
     the log and pushes the footer off the bottom of the screen rather than
     scrolling inside it. */
  /* Compaction has to be VISIBLE. It runs server-side and asynchronously, so it never delays
     the turn that triggers it -- but it occupies a backend slot, and on a single-slot
     llama-server the NEXT turn queues behind it (measured: a 5-token turn took 5.04s instead
     of 0.3s). Unannounced that is indistinguishable from the model hanging. The marker also
     stays in the log afterwards so that if a reply seems to have forgotten something, it is
     possible to see at a glance whether compaction is why. */
  .compaction {
    align-self: center; margin: 10px 0; padding: 3px 10px; border-radius: 10px;
    font: 12px/1.5 var(--mono); color: var(--muted);
    background: var(--panel); border: 1px dashed var(--edge);
  }
  .compaction.active { color: var(--warn); border-style: solid; }
  #log {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 780px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  .who {
    flex: 0 0 52px; font: 600 11px/1.8 var(--mono); letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); padding-top: 2px;
  }
  .msg.you .who { color: var(--accent); }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .body { white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
  .body.partial { color: var(--muted); font-style: italic; }
  .think {
    border-left: 2px solid var(--edge); padding: 4px 0 4px 10px; margin-bottom: 8px;
    color: var(--muted); font-size: 13px; white-space: pre-wrap;
    max-height: 8.5em; overflow-y: auto; overscroll-behavior: contain;
    width: 100%; min-width: 0;
  }
  .think summary { cursor: pointer; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .tool {
    font: 12px/1.5 var(--mono); color: var(--muted); margin: 2px 0 6px;
    padding-left: 10px; border-left: 2px solid var(--accent-dim);
  }
  .tool.running::after { content: " …"; }
  .tool.failed { color: var(--rec); border-left-color: var(--rec); }
  footer {
    border-top: 1px solid var(--edge); background: var(--panel);
    padding: 12px 14px; display: flex; gap: 10px; align-items: center;
  }
  #talk {
    flex: 0 0 auto; padding: 12px 26px; font-size: 15px; font-weight: 600;
    border-color: var(--accent-dim); background: #18241f;
  }
  #talk.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
  #shush { flex: 0 0 auto; padding: 12px 16px; font-size: 15px; }
  #shush.active { border-color: var(--rec); color: var(--rec); }
  #text { flex: 1; }
  #status { font: 12px/1.4 var(--mono); color: var(--muted); padding: 6px 16px; border-top: 1px solid var(--edge); }
  #status.err { color: var(--rec); }
  #status.warn { color: var(--warn); }
  a { color: var(--accent); }

  /* Touch sizing. Driven by (pointer: coarse) rather than width, because the
     thing that matters is a fingertip, not a small window -- a narrow desktop
     window still has a mouse and does not need 56px targets.
     44px is the usual floor for a reliable tap; the primary action gets more. */
  /* Keyboard-dictation mode: no talk button, so the field is the control. */
  body.kbd-mode #text { font-size: 16px; }
  @media (pointer: coarse) {
    .replay { padding: 8px 14px; font-size: 14px; min-height: 40px; }
    body.kbd-mode #text { flex: 1 0 100%; min-height: 54px; }
    body.kbd-mode footer { gap: 8px; }
    body { font-size: 16px; }

    header { padding: 10px 12px; gap: 8px; }
    #gear { padding: 10px 14px; font-size: 20px; min-height: 44px; }
    #crumb { font-size: 11px; }

    footer { flex-wrap: wrap; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    /* The talk button takes its own full-width row: it is the one control you
       aim at without looking, often one-handed. */
    #talk { order: -1; flex: 1 0 100%; min-height: 62px; font-size: 18px; padding: 16px; }
    #shush { min-width: 62px; min-height: 50px; font-size: 20px; padding: 12px; }
    /* 16px is not cosmetic: a smaller font makes mobile browsers zoom the page
       on focus, which then leaves the layout scrolled sideways. */
    #text { min-height: 50px; font-size: 16px; padding: 12px 14px; }

    #log { padding: 14px 12px; }
    .msg { gap: 8px; }
    .who { flex-basis: 44px; font-size: 10px; }

    #panel { width: min(420px, 100vw); }
    #panel section { padding: 16px; }
    #panel select, #panel input[type=text] { min-height: 44px; font-size: 15px; }
    #panel .chk { padding: 8px 0; min-height: 44px; }
    #panel .chk input[type=checkbox] { width: 22px; height: 22px; }
    .row { margin-bottom: 14px; }
    .row > span:first-child { flex-basis: 84px; font-size: 14px; }
    /* A 10px-wide slider thumb is unhittable with a thumb. */
    #rate { height: 34px; }
    #rate::-webkit-slider-thumb { width: 26px; height: 26px; }
    #panelClose { min-width: 44px; min-height: 44px; font-size: 18px; }
    #clear { min-height: 48px; }
    .phead { padding: 15px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>voicebox</h1>
  <!-- What you are talking to, at a glance. The settings live behind the panel
       now, so without this there is no way to see which model is answering
       without opening it. -->
  <div id="crumb" title="current backend · model · voice"></div>
  <button id="gear" aria-label="Settings" aria-expanded="false">☰</button>
</header>

<div id="log"></div>

<footer>
  <button id="talk" disabled>loading…</button>
  <button id="shush" title="Stop speaking (Esc)" disabled>⏹</button>
  <input id="text" placeholder="…or type here and press Enter" />
</footer>

<div id="scrim" hidden></div>
<aside id="panel" hidden aria-label="Settings">
  <div class="phead"><span>Settings</span><button id="panelClose" aria-label="Close">✕</button></div>

  <section>
    <h2>Chat</h2>
    <label class="row"><span>Server</span><select id="backend"></select></label>
    <label class="row"><span>Model</span><select id="model"></select></label>
    <label class="row" id="effortRow"><span>Thinking</span><select id="effort"></select></label>
    <label class="chk" id="toolsRow" style="display:none"><input type="checkbox" id="useTools" />
      Let the model use tools (search, memory, date)</label>
    <label class="chk"><input type="checkbox" id="tagInput" checked />
      Tell the model when a message was dictated</label>
  </section>

  <section>
    <h2>Speech in</h2>
    <label class="row"><span>Recogniser</span><select id="sttEngine"></select></label>
    <label class="chk"><input type="checkbox" id="autosend" checked />
      Send as soon as I stop talking</label>
  </section>

  <section>
    <h2>Speech out</h2>
    <label class="chk"><input type="checkbox" id="speak" checked /> Speak replies</label>
    <label class="row"><span>Engine</span><select id="ttsEngine">
      <option value="piper">Piper (server)</option>
      <option value="system">system</option>
      <option value="kokoro">Kokoro (in-browser)</option>
    </select></label>
    <label class="row"><span>Voice</span><select id="voice"></select></label>
    <label class="row" id="speakerRow" style="display:none"><span>Speaker</span>
      <span class="rate"><input type="range" id="speaker" min="0" max="0" step="1" value="0" />
      <span id="speakerVal">0</span></span></label>
    <label class="row"><span>Speed</span>
      <span class="rate"><input type="range" id="rate" min="0.5" max="2.5" step="0.05" value="1" />
      <span id="rateVal">1.00x</span></span></label>
    <label class="chk"><input type="checkbox" id="speakThink" />
      Read the reasoning aloud, as an aside</label>
    <label class="row" id="thinkVoiceRow"><span>Aside voice</span><select id="thinkVoice"></select></label>
  </section>

  <section>
    <div class="phead" style="padding-left:0;padding-right:0;border:0">Conversations</div>
    <label class="row"><span>Session</span><select id="sessionSel"></select></label>
    <div class="row" style="gap:6px">
      <button id="sessNew">New</button>
      <button id="sessRename">Rename</button>
      <button id="sessDelete">Delete</button>
    </div>
    <div class="row"><span id="sessInfo" style="font:12px/1.4 var(--mono);color:var(--muted)"></span></div>
  </section>

  <section>
    <button id="clear">Clear conversation</button>
  </section>
</aside>

<div id="status">starting</div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4";

// ---------------------------------------------------------------------------
// Speech in. A small dedicated recogniser, not a multimodal LLM: whisper-tiny
// is ~40 MB where Gemma's audio path drags the whole 3.4 GB model in with it.
// Runs on WebGPU when the adapter allows and falls back to WASM, which is
// perfectly usable at this size.
// ---------------------------------------------------------------------------
// Whisper sizes, smallest first. tiny is fast and mediocre; base and small are
// noticeably better English and still trivial next to a 4B multimodal model.
const WHISPER = {
  "whisper-tiny":  { id: "onnx-community/whisper-tiny.en",  label: "Whisper tiny (~40 MB)" },
  "whisper-base":  { id: "onnx-community/whisper-base.en",  label: "Whisper base (~80 MB)" },
  "whisper-small": { id: "onnx-community/whisper-small.en", label: "Whisper small (~250 MB)" },
};
let STT_MODEL = WHISPER["whisper-tiny"].id;

// The page is served cross-origin-isolated, so SharedArrayBuffer exists and
// onnxruntime can run WASM on several threads. Capped well below the core count
// on purpose: whisper-tiny is small enough that past a handful of threads the
// synchronisation costs more than the parallelism returns, and this box reports
// 40 cores.
env.backends.onnx.wasm.numThreads = Math.max(1, Math.min(8, navigator.hardwareConcurrency || 4));

// onnxruntime loads several sub-models under Promise.all; when one backend is
// unavailable, siblings can reject after the failure has already been handled.
// Those are noise, not faults -- log them, do not let them read as a crash.
window.addEventListener("unhandledrejection", (e) => {
  const m = e.reason?.message || String(e.reason);
  console.warn("[voicebox] late rejection:", e.reason);
  // Shown, never swallowed. Suppressing these once hid a real transcription
  // failure behind a status line that simply said "transcribing…" forever.
  const el = document.getElementById("status");
  if (el && !el.classList.contains("err")) { el.textContent = "async: " + m; el.className = "warn"; }
});

const $ = (id) => document.getElementById(id);
const logEl = $("log"), statusEl = $("status");
const backendEl = $("backend"), modelEl = $("model"), voiceEl = $("voice");
const sttEngineEl = $("sttEngine"), effortEl = $("effort");
const thinkVoiceEl = $("thinkVoice"), shushBtn = $("shush");
const speakerEl = $("speaker"), speakerRow = $("speakerRow"), speakerVal = $("speakerVal");

// Multi-speaker voices: en_US-libritts-high ships 904 of them in one file, and
// without this the service renders speaker 0 forever -- 903 voices on disk that
// nothing can reach. Shown only for a voice that actually has more than one.
function syncSpeakerRange() {
  const v = (piperVoices || []).find((x) => x.id === voiceEl.value);
  const n = (v && v.speakers) || 1;
  speakerRow.style.display = n > 1 ? "" : "none";
  speakerEl.max = String(n - 1);
  const saved = parseInt(localStorage.getItem("vb.speaker." + voiceEl.value) || "0", 10);
  speakerEl.value = String(Math.min(Math.max(0, saved), n - 1));
  speakerVal.textContent = speakerEl.value + " / " + (n - 1);
}
speakerEl.oninput = () => {
  speakerVal.textContent = speakerEl.value + " / " + speakerEl.max;
  localStorage.setItem("vb.speaker." + voiceEl.value, speakerEl.value);
};

// --- settings panel ----------------------------------------------------------
const panel = $("panel"), scrim = $("scrim");
function setPanel(open) {
  panel.hidden = !open;
  scrim.hidden = !open;
  $("gear").setAttribute("aria-expanded", String(open));
}
$("gear").onclick = () => setPanel(panel.hidden);
$("panelClose").onclick = () => setPanel(false);
scrim.onclick = () => setPanel(false);

// crumb: the one thing that must stay visible once the controls are hidden --
// otherwise there is no way to tell which model just answered you.
function updateCrumb() {
  const model = (modelEl.value || "").split("/").pop() || "no model";
  const bits = [backendEl.selectedOptions[0]?.textContent || backendEl.value, model];
  if ($("speak").checked) {
    const v = voiceEl.selectedOptions[0]?.textContent || "";
    if (v) bits.push(v.split("·")[0].trim());
  }
  if (effortEl.style.display !== "none" && effortEl.value) bits.push(effortEl.value);
  if (SERVER_TOOLS && $("useTools").checked) bits.push("🔧");
  $("crumb").textContent = bits.filter(Boolean).join("  ·  ");
}
const talkBtn = $("talk"), textEl = $("text");

// Telling the model that a message was dictated helps it read past recogniser
// artefacts -- homophones, mangled proper nouns, missing punctuation.
//
// Only VOICE is tagged, and the note is deliberately terse. A longer version
// that also tagged [typed] and explained both cases made a small model (granite
// 1b) misbehave in two measured ways: it echoed the marker into its own replies
// ("[typed] As of 2023..."), and once it commented on the phrasing of a message
// it kept doing so for the rest of the conversation, escalating to suggesting
// rephrasings instead of answering. Absence of a tag carries "typed" perfectly
// well, and saying less gives a weak model less to imitate.
const INPUT_MODE_PREAMBLE =
  "A message beginning with [voice] was dictated by speech recognition and may " +
  "contain misheard words. Answer it normally. Never write [voice] yourself and " +
  "never remark on how the message was entered or worded.";

// A small model may still echo the marker. Strip it rather than show it.
const stripTag = (t) => t.replace(/^\s*\[(voice|typed)\]\s*/i, "");

let transcriber = null;
// Probed once and shared. Both models want the same answer, and requesting an
// adapter twice is pointless -- but it must be probed rather than assumed: see
// the note in ensureWhisper about navigator.gpu existing on machines that will
// not hand one out.
let GPU_DEVICE = null;
async function pickDevice() {
  if (GPU_DEVICE) return GPU_DEVICE;
  GPU_DEVICE = "wasm";
  if (navigator.gpu) {
    try {
      const a = await navigator.gpu.requestAdapter();
      if (a) GPU_DEVICE = "webgpu";
    } catch { /* stays wasm */ }
  }
  return GPU_DEVICE;
}
let media = null, recorder = null, chunks = [];
let history = [];
let busy = false;
let BUILD = "?";
let SERVER_TTS = false;
let SERVER_TOOLS = false;

function status(msg, kind = "") { statusEl.textContent = msg; statusEl.className = kind; }

function addMsg(who, text, cls = "") {
  const row = document.createElement("div");
  row.className = "msg " + (who === "you" ? "you" : "");
  // .col exists so that everything attached to a turn -- thinking, tool lines,
  // the reply -- stacks VERTICALLY. They are inserted with
  // out.parentNode.insertBefore, and without this wrapper that parent is the
  // flex ROW, which laid the thinking block out beside the reply and squeezed
  // both into narrow columns on a phone.
  row.innerHTML = `<div class="who">${who}</div>` +
                  `<div class="col"><div class="body ${cls}"></div></div>`;
  row.querySelector(".body").textContent = text;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  return row.querySelector(".body");
}

// --- sessions ---------------------------------------------------------------
//
// The conversation lives on the SERVER now. The page holds a view of it, not the original.
// That is what makes a refresh survivable, and what lets the phone, the iPad and the laptop
// see the same conversation -- localStorage could do neither: it is per-browser and it is not
// meant to hold megabytes of transcript.
//
// localStorage keeps exactly ONE thing: which session is current. That is the job it is
// actually good at -- tiny, disposable, and if it is lost you land in the picker rather than
// losing anything.

// A per-tab id so this device can recognise the echo of its own turns coming back over the
// event stream. Without it, everything you say would render twice: once locally as you send
// it, once again when the server broadcasts it.
const CLIENT_ID = (crypto.randomUUID?.() || String(Math.random())).slice(0, 12);

let sessionId = localStorage.getItem("vb.session") || null;
let sessionHead = 0;          // highest seq this page has rendered
let compactedThrough = 0;     // everything at or below this is represented by summary
let summaryText = "";
let sessionES = null;         // EventSource
let compactingEl = null;      // the transient "compacting" marker, if one is showing

const sessionSel = $("sessionSel");

// renderMessage replays one stored turn into the log.
//
// Two fidelity details that a naive replay gets wrong. The [voice] marker is STORED but
// deliberately never SHOWN -- the user knows how they typed it and echoing the marker back is
// noise. And assistant turns need their replay button re-attached, or a restored conversation
// silently loses the ability to speak its own replies.
function renderMessage(m) {
  if (m.role === "user") {
    addMsg("you", stripTag(m.content));
  } else if (m.role === "assistant") {
    const out = addMsg("bot", m.content);
    addReplay(out, m.content);
  }
}

function showCompactionMarker(text, active) {
  const d = document.createElement("div");
  d.className = "compaction" + (active ? " active" : "");
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

// buildContext produces the messages array sent to the model.
//
// This is where compaction is honoured: everything at or below compactedThrough is represented
// by the summary instead of being resent. Ignoring it would send turns the summary already
// covers -- the conversation would keep growing and compaction would achieve nothing.
function buildContext() {
  const msgs = [];
  if (summaryText) {
    msgs.push({ role: "system",
      content: "Notes from earlier in this conversation:\n" + summaryText });
  }
  const current = modelEl.value;
  for (const m of history) {
    let content = m.content;
    // A turn produced by a DIFFERENT model is labelled; a model reading its own words sees
    // exactly what it saw before and pays nothing for this. Without the label the incoming
    // model reads its predecessor's turns as its own first-person history and tries to
    // reconcile them with its own system prompt -- openclaw-go 5104a5a, where a model went in
    // circles over which model it was after a mid-conversation swap.
    //
    // Rendered here rather than stored, like INPUT_MODE_PREAMBLE above: the transcript keeps
    // what was actually said, and switching the model again changes which turns get labelled.
    if (m.role === "assistant" && m.model && m.model !== current) {
      content = `[written by ${m.model}, a different model]\n${content}`;
    }
    // Only role and content go upstream. `model` is bookkeeping for this page; an unrecognised
    // field on a message is ignored by some backends and rejected by others.
    msgs.push({ role: m.role, content });
  }
  return msgs;
}

async function sessionLoad(id, { silent = false } = {}) {
  const r = await fetch(`/api/sessions/${id}?limit=80`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  sessionId = d.id;
  localStorage.setItem("vb.session", sessionId);
  sessionHead = d.head || 0;
  compactedThrough = d.compacted_through || 0;
  summaryText = d.summary || "";
  history = [];
  logEl.innerHTML = "";
  if (d.truncated) {
    showCompactionMarker(`⋯ earlier turns not shown (${d.total} total)`, false);
  }
  if (summaryText) {
    showCompactionMarker(`⋯ ${compactedThrough} earlier turns summarised`, false);
  }
  // RENDER every returned turn, but SEND only the ones the summary does not already cover.
  // Conflating those two is the bug this mechanism exists to prevent: the scrollback wants the
  // whole window so the conversation reads correctly, while `history` is what gets posted back
  // to the model -- and resending summarised turns makes compaction a no-op.
  //
  // Worse than a no-op, because the two sides then disagree about the size of the context. The
  // server's estTokensFrom counts only messages above compacted_through, so it believes the
  // context is small while this page ships summary-plus-everything; the hard threshold
  // under-counts, never fires, and the backend silently drops the front of the conversation.
  for (const m of d.messages) {
    if (m.seq > compactedThrough) history.push({ role: m.role, content: m.content, model: m.model });
    renderMessage(m);
  }
  sessionSubscribe();
  if (!silent) status(`resumed "${d.title || "untitled"}" — ${d.total} turns`);
  return d;
}

async function sessionNew() {
  const r = await fetch("/api/sessions", { method: "POST", body: "{}" });
  const d = await r.json();
  sessionId = d.id;
  localStorage.setItem("vb.session", sessionId);
  sessionHead = 0; compactedThrough = 0; summaryText = "";
  history = []; logEl.innerHTML = "";
  sessionSubscribe();
  await sessionRefreshList();
  return d;
}

// sessionGone handles this conversation disappearing underneath the page -- deleted from
// another device, or otherwise absent from the store.
//
// Doing nothing is NOT a harmless default, which is why this exists. The page would keep
// posting a session id the server no longer has; the hook declines to persist every turn and
// writes one line to the server log, while the UI carries on looking completely normal. Chat
// that silently stops being saved is the failure the whole session mechanism exists to prevent,
// so the page moves to a fresh session rather than talking into a conversation that is gone.
//
// The marker goes in AFTER the new session has cleared the log, or it would be wiped by the
// thing that is supposed to explain it.
async function sessionGone() {
  if (sessionES) { sessionES.close(); sessionES = null; }
  localStorage.removeItem("vb.session");
  sessionId = null;
  try {
    await sessionNew();
    await sessionRefreshList();
    showCompactionMarker("⋯ this conversation was deleted on another device", false);
    status("conversation deleted elsewhere — started a new one", "warn");
  } catch {
    status("conversation deleted elsewhere; could not start a new one", "err");
  }
}

// sessionSubscribe opens the live stream.
//
// EventSource reconnects on its own and resends Last-Event-ID, and the server replays
// everything after that seq -- so a phone that sleeps, changes network or is backgrounded
// closes its own gap with no logic here. `since` seeds the FIRST connection so a page that has
// just replayed its history does not immediately receive it all again.
function sessionSubscribe() {
  if (sessionES) { sessionES.close(); sessionES = null; }
  if (!sessionId) return;
  const es = new EventSource(`/api/sessions/${sessionId}/events?since=${sessionHead}`);
  sessionES = es;
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.kind === "compacting") {
      if (!compactingEl) compactingEl = showCompactionMarker("⋯ compacting conversation…", true);
      return;
    }
    if (ev.kind === "compact_failed") {
      if (compactingEl) { compactingEl.remove(); compactingEl = null; }
      return;
    }
    if (ev.kind === "compact") {
      if (compactingEl) { compactingEl.remove(); compactingEl = null; }
      // Re-read rather than guess: the server decides how far the summary reaches.
      fetch(`/api/sessions/${sessionId}?limit=0`).then((r) => r.json()).then((d) => {
        compactedThrough = d.compacted_through || 0;
        summaryText = d.summary || "";
        // Drop the turns the summary now covers from what we will resend.
        history = d.messages.filter((m) => m.seq > compactedThrough)
                            .map((m) => ({ role: m.role, content: m.content, model: m.model }));
        showCompactionMarker(`⋯ ${compactedThrough} earlier turns summarised`, false);
      }).catch(() => {});
      return;
    }
    if (ev.kind === "deleted") { sessionGone(); return; }
    // kind: commit
    for (const m of ev.msgs || []) {
      if (m.seq <= sessionHead) continue;   // already have it
      sessionHead = m.seq;
      // Our own turns are already on screen -- the user's was rendered as they sent it and
      // the reply streamed in live. Re-rendering the echo would duplicate both.
      if (ev.origin === CLIENT_ID) continue;
      history.push({ role: m.role, content: m.content, model: m.model });
      renderMessage(m);
      status(`synced from another device — ${m.role}`);
    }
  };
  es.onerror = () => {
    // EventSource retries a DROPPED connection on its own, and there is nothing useful to do
    // about that here. A non-200 is different: the spec fails the connection permanently,
    // readyState goes CLOSED and there are no further attempts. A deleted session returns 404,
    // so that is the state this lands in -- and it is also where a `deleted` event that was
    // dropped rather than delivered ends up, since broadcast drops instead of blocking. So the
    // check belongs here as well as in onmessage, or the rarer path is the unhandled one.
    if (es !== sessionES || es.readyState !== EventSource.CLOSED || !sessionId) return;
    fetch(`/api/sessions/${sessionId}`)
      .then((r) => { if (r.status === 404) sessionGone(); })
      .catch(() => { /* offline: the session may still be there. Leave it alone. */ });
  };
}

async function sessionRefreshList() {
  try {
    const r = await fetch("/api/sessions");
    const list = await r.json();
    sessionSel.innerHTML = "";
    for (const m of list) {
      const o = document.createElement("option");
      o.value = m.id;
      const when = new Date(m.updated).toLocaleString([], { month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit" });
      o.textContent = `${m.title || "untitled"} — ${m.count} · ${when}`;
      sessionSel.appendChild(o);
    }
    if (sessionId) sessionSel.value = sessionId;
    const cur = list.find((m) => m.id === sessionId);
    $("sessInfo").textContent = cur ? `${cur.count} turns` : `${list.length} saved`;
  } catch (e) { console.warn("[sessions] list failed:", e); }
}

sessionSel.onchange = async () => {
  try { await sessionLoad(sessionSel.value); await sessionRefreshList(); }
  catch (e) { status("could not open that conversation: " + e.message, "err"); }
};
$("sessNew").onclick = async () => { await sessionNew(); status("new conversation"); };
$("sessRename").onclick = async () => {
  if (!sessionId) return;
  const title = prompt("Name this conversation:", sessionSel.selectedOptions[0]?.textContent || "");
  if (title === null) return;
  await fetch(`/api/sessions/${sessionId}`, { method: "PATCH",
    body: JSON.stringify({ title }) });
  await sessionRefreshList();
};
$("sessDelete").onclick = async () => {
  if (!sessionId || !confirm("Delete this conversation? This cannot be undone.")) return;
  await fetch(`/api/sessions/${sessionId}`, { method: "DELETE" });
  localStorage.removeItem("vb.session");
  await sessionNew();
  status("deleted");
};

// --- backends ---------------------------------------------------------------
async function loadBackends() {
  const r = await fetch("/api/backends");
  const d = await r.json();
  backendEl.innerHTML = "";
  for (const b of d.backends) {
    const o = document.createElement("option");
    o.value = b.id;
    o.textContent = b.label + (b.needs_key && !b.has_key ? "  (no key)" : "");
    o.disabled = b.needs_key && !b.has_key;
    backendEl.appendChild(o);
  }
  BUILD = d.build || "?";
  SERVER_TTS = !!d.server_tts;
  SERVER_TOOLS = !!d.tools;
  // Hidden entirely when no tool server is configured: a switch that cannot do
  // anything is worse than no switch.
  $("toolsRow").style.display = SERVER_TOOLS ? "" : "none";
  console.log("[voicebox] page build", BUILD);
  backendEl.value = localStorage.getItem("vb.backend") || d.default;
  await loadModels();
}

async function loadModels() {
  modelEl.innerHTML = `<option>loading…</option>`;
  try {
    const r = await fetch("/v1/models", { headers: { "X-Voicebox-Backend": backendEl.value } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const ids = (d.data || d.models || []).map((m) => m.id || m.name || m.model).filter(Boolean);
    modelEl.innerHTML = "";
    for (const id of ids.sort()) {
      const o = document.createElement("option");
      o.value = id;
      // A gguf path is unreadable in a dropdown; the filename is the identity.
      o.textContent = id.split("/").pop();
      o.title = id;
      modelEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.model." + backendEl.value);
    if (saved && ids.includes(saved)) modelEl.value = saved;
    if (!ids.length) modelEl.innerHTML = `<option value="">(server listed none)</option>`;
  } catch (e) {
    modelEl.innerHTML = `<option value="">(unreachable)</option>`;
    status(`${backendEl.value}: ${e.message}`, "err");
  }
}

backendEl.onchange = async () => {
  localStorage.setItem("vb.backend", backendEl.value);
  await loadModels();
  await loadEffort();
  updateCrumb();
};
modelEl.onchange = () => {
  localStorage.setItem("vb.model." + backendEl.value, modelEl.value);
  updateCrumb();
  // Reasoning support is a property of the WEIGHTS, not the server, so it has
  // to be re-asked whenever the model changes.
  loadEffort();
};

// --- how hard the model should think --------------------------------------
// The control is discovered, not assumed: the server interrogates the backend
// (llama.cpp /props, ollama /api/show) and reports which mechanism, if any, that
// model actually honours. Different families spell this differently and most
// models have no such knob at all, so a fixed dropdown would be wrong more often
// than right. Hidden entirely when nothing is supported.
let effortKnob = { kind: "none" };

async function loadEffort() {
  effortKnob = { kind: "none" };
  effortEl.style.display = "none";
  $("effortRow").style.display = "none";
  try {
    const q = new URLSearchParams({ backend: backendEl.value, model: modelEl.value || "" });
    const r = await fetch("/api/effort?" + q);
    if (!r.ok) return;
    effortKnob = await r.json();
    if (effortKnob.kind === "none" || !(effortKnob.levels || []).length) return;

    effortEl.innerHTML = "";
    const auto = document.createElement("option");
    auto.value = ""; auto.textContent = "think: default";
    effortEl.appendChild(auto);
    effortKnob.levels.forEach((lv, i) => {
      const o = document.createElement("option");
      o.value = lv;
      o.textContent = "think: " + (effortKnob.labels?.[i] || lv);
      effortEl.appendChild(o);
    });
    effortEl.title = effortKnob.source + "  (" +
      (effortKnob.kind === "reasoning_effort"
        ? "sent as reasoning_effort"
        : "sent as chat_template_kwargs." + effortKnob.variable) + ")";
    const saved = localStorage.getItem("vb.effort." + backendEl.value);
    if (saved && effortKnob.levels.includes(saved)) effortEl.value = saved;
    effortEl.style.display = "";
    $("effortRow").style.display = "";
  } catch { /* no control offered; the dropdown stays hidden */ }
}

effortEl.onchange = () => { localStorage.setItem("vb.effort." + backendEl.value, effortEl.value); updateCrumb(); };

// The aside voice is picked from the same list as the main one; defaulting to a
// DIFFERENT entry is the whole point, so the two are told apart by ear.
function syncThinkVoices() {
  const on = $("speakThink").checked;
  $("thinkVoiceRow").style.display = on ? "" : "none";
  if (!on) return;
  const opts = [...voiceEl.options].map((o) => ({ v: o.value, t: o.textContent }));
  thinkVoiceEl.innerHTML = "";
  for (const o of opts) {
    const e = document.createElement("option");
    e.value = o.v; e.textContent = "think: " + o.t;
    thinkVoiceEl.appendChild(e);
  }
  const saved = localStorage.getItem("vb.thinkvoice");
  if (saved && opts.some((o) => o.v === saved)) thinkVoiceEl.value = saved;
  else {
    const other = opts.find((o) => o.v !== voiceEl.value);
    if (other) thinkVoiceEl.value = other.v;
  }
}
thinkVoiceEl.onchange = () => localStorage.setItem("vb.thinkvoice", thinkVoiceEl.value);
$("speakThink").onchange = () => {
  localStorage.setItem("vb.speakthink", $("speakThink").checked ? "1" : "0");
  syncThinkVoices();
  if (!$("speakThink").checked) thinkQueue = "";
};

// applyEffort adds whichever field this model actually reads.
function applyEffort(body) {
  const lv = effortEl.value;
  if (!lv || effortKnob.kind === "none") return body;
  if (effortKnob.kind === "reasoning_effort") {
    body.reasoning_effort = lv;
  } else if (effortKnob.kind === "chat_template_kwargs") {
    // The value must be the JSON TYPE the template expects, not a string that
    // looks like it. llama.cpp validates: sending "true" for a boolean knob is
    // rejected outright with
    //   invalid type for "enable_thinking" (expected boolean, got string)
    // so a boolean level is converted rather than passed through.
    const val = lv === "true" ? true : lv === "false" ? false : lv;
    body.chat_template_kwargs = { ...(body.chat_template_kwargs || {}), [effortKnob.variable]: val };
  }
  return body;
}

// --- speech out -------------------------------------------------------------
// Two engines. The system synthesiser is free and instant but on Linux it is
// the espeak family, which is what "not great" sounds like. Kokoro is an 86 MB
// ONNX model with 55 voices, loaded only when selected, and only the chosen
// voice file (~520 KB) is fetched on top of the model.
const KOKORO_MODEL = "onnx-community/Kokoro-82M-v1.0-ONNX";
let kokoro = null, kokoroVoices = null, kokoroLoading = null, kokoroDevice = "?";

const rateEl = $("rate"), rateValEl = $("rateVal");
const ttsEngineEl = $("ttsEngine");
// One element, so a new utterance replaces the old rather than overlapping.
//
// It is REPLACED when the set of audio devices changes: a long-lived media
// element can stay bound to the output that existed when it was created, so
// plugging in headphones mid-conversation left the audio on the speakers until
// the page was reloaded. A fresh element picks up the current default.
let audioEl = new Audio();

function freshAudioElement() {
  const was = audioEl;
  audioEl = new Audio();
  audioEl.playbackRate = was.playbackRate;
  try { was.pause(); } catch { /* nothing playing */ }
  // Pausing does NOT fire `ended`, so an utterance that was mid-playback would
  // leave its promise pending and wedge the queue permanently. Resolve it by
  // hand -- the caller only ever waits for "this clip is finished with", and it
  // is.
  const done = was.onended;
  was.onended = was.onerror = null;
  if (typeof done === "function") done();
}

// A phone backgrounds a tab without warning. Releasing on the way out means a
// tab left mid-recording does not keep the microphone from the keyboard or from
// any other app.
window.addEventListener("pagehide", () => {
  try { activeRecognition?.abort(); } catch { /* not running */ }
  releaseMic(media);
});

if (navigator.mediaDevices?.addEventListener) {
  navigator.mediaDevices.addEventListener("devicechange", async () => {
    freshAudioElement();
    // The system synthesiser holds its own output binding, which the browser
    // only re-resolves between utterances -- cancelling forces that.
    const wasSpeaking = speechSynthesis.speaking;
    if (wasSpeaking) speechSynthesis.cancel();
    let where = "";
    try {
      const outs = (await navigator.mediaDevices.enumerateDevices())
        .filter((d) => d.kind === "audiooutput");
      const dflt = outs.find((d) => d.deviceId === "default") || outs[0];
      if (dflt?.label) where = " → " + dflt.label.replace(/^Default\s*-\s*/i, "");
    } catch { /* labels need permission; the switch still happened */ }
    console.log("[voicebox] audio devices changed; rebound output" + where);
    status("audio output changed" + where);
  });
}

function rate() { return parseFloat(rateEl.value) || 1; }
rateEl.oninput = () => {
  rateValEl.textContent = rate().toFixed(2) + "x";
  localStorage.setItem("vb.rate", rateEl.value);
  // Kokoro output is an <audio> element, so speed applies live to what is
  // already playing. The system synthesiser can only take a rate at the moment
  // an utterance starts.
  if (ttsEngineEl.value !== "piper") audioEl.playbackRate = rate();
};
rateEl.value = localStorage.getItem("vb.rate") || "1";
rateValEl.textContent = rate().toFixed(2) + "x";

function loadSystemVoices() {
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  voiceEl.innerHTML = "";
  for (const v of vs) {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    voiceEl.appendChild(o);
  }
  const saved = localStorage.getItem("vb.voice.system");
  if (saved && vs.some((v) => v.name === saved)) voiceEl.value = saved;
}

async function ensureKokoro() {
  if (kokoro) return kokoro;
  if (kokoroLoading) return kokoroLoading;
  // On failure the in-flight promise MUST be cleared. Memoising a rejected
  // promise means the first failure is replayed verbatim on every later attempt,
  // so a fixed page still reports the old error until a full reload -- which is
  // indistinguishable from the fix not working.
  kokoroLoading = (async () => {
    status("loading Kokoro voice model (86 MB, cached after the first run)…");
    const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
    const dev = await pickDevice();
    // fp32 on the GPU, q8 on the CPU: quantised weights buy nothing once the
    // work is on a GPU, and the fp32 graph is the better-supported path there.
    kokoro = await KokoroTTS.from_pretrained(KOKORO_MODEL, {
      dtype: dev === "webgpu" ? "fp32" : "q8", device: dev,
      progress_callback: (p) => {
        if (p.status === "progress" && p.total)
          status(`Kokoro ${(100 * p.loaded / p.total).toFixed(0)}% (${p.file})`);
      },
    });
    // NOT list_voices(): that method only does console.table() and returns
    // undefined. The voices getter is the actual data, keyed by voice id, with
    // {name, language, gender, overallGrade} per entry.
    kokoroVoices = kokoro.voices || {};
    kokoroDevice = dev;
    status(`Kokoro ready on ${dev} — ${Object.keys(kokoroVoices).length} voices`);
    return kokoro;
  })().catch((e) => { kokoroLoading = null; kokoro = null; throw e; });
  return kokoroLoading;
}

async function loadKokoroVoices() {
  voiceEl.innerHTML = `<option>loading…</option>`;
  try {
    await ensureKokoro();
    const ids = Object.keys(kokoroVoices);
    if (!ids.length) throw new Error("model loaded but exposed no voices");

    // Kokoro grades its own voices A..F and most of them are middling. Sorting
    // by grade puts the ones actually worth listening to at the top, rather
    // than making you audition 55 alphabetically.
    const grade = (id) => {
      const g = kokoroVoices[id].overallGrade || "F";
      return "ABCDEF".indexOf(g[0]) * 3 - (g.includes("+") ? 1 : 0);
    };
    ids.sort((a, b) => grade(a) - grade(b) || a.localeCompare(b));

    voiceEl.innerHTML = "";
    for (const id of ids) {
      const v = kokoroVoices[id];
      const o = document.createElement("option");
      o.value = id;
      o.textContent = `${v.name} · ${v.gender?.[0] || "?"} · ${v.language} · ${v.overallGrade}`;
      o.title = id;
      voiceEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.voice.kokoro");
    if (saved && ids.includes(saved)) voiceEl.value = saved;
    else if (ids.includes("af_heart")) voiceEl.value = "af_heart";
  } catch (e) {
    voiceEl.innerHTML = `<option value="">(Kokoro failed)</option>`;
    status("Kokoro unavailable: " + e.message, "err");
    ttsEngineEl.value = "system";
    loadSystemVoices();
  }
}

speechSynthesis.onvoiceschanged = () => { if (ttsEngineEl.value === "system") loadSystemVoices(); };
voiceEl.onchange = () => {
  localStorage.setItem("vb.voice." + ttsEngineEl.value, voiceEl.value);
  if (ttsEngineEl.value === "piper") syncSpeakerRange();
  updateCrumb();
};
ttsEngineEl.onchange = async () => {
  localStorage.setItem("vb.tts", ttsEngineEl.value);
  stopSpeaking();
  if (ttsEngineEl.value === "piper") await loadPiperVoices();
  else if (ttsEngineEl.value === "kokoro") await loadKokoroVoices();
  else loadSystemVoices();
};

// Piper runs on the server, so the browser downloads nothing and the speed is
// independent of whatever the browser can negotiate with the GPU. Rate is applied
// at SYNTHESIS (length_scale) rather than by resampling, so faster speech does
// not come out pitch-shifted the way playbackRate makes it.
let piperVoices = [];

async function loadPiperVoices() {
  voiceEl.innerHTML = `<option>loading…</option>`;
  try {
    const r = await fetch("/voices");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    piperVoices = (await r.json()).voices || [];
    if (!piperVoices.length) throw new Error("service has no voices installed");
    voiceEl.innerHTML = "";
    for (const v of piperVoices) {
      const o = document.createElement("option");
      o.value = v.id;
      o.textContent = `${v.name} · ${v.lang.replace("_", "-")} · ${v.quality}` +
        (v.speakers > 1 ? ` · ${v.speakers} voices` : "");
      o.title = v.id;
      voiceEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.voice.piper");
    if (saved && piperVoices.some((v) => v.id === saved)) voiceEl.value = saved;
    syncThinkVoices();
    syncSpeakerRange();
    updateCrumb();
    status(`Piper ready — ${piperVoices.length} voices, on the server`);
  } catch (e) {
    voiceEl.innerHTML = `<option value="">(unavailable)</option>`;
    status("Piper unavailable: " + e.message + " — falling back to system voices", "warn");
    ttsEngineEl.value = "system";
    loadSystemVoices();
  }
}

async function speakPiper(text, role = "reply") {
  const t0 = performance.now();
  // Generation for the NEXT sentence is a fetch, and a hidden tab throttles
  // those. Playback of an already-fetched clip continues; the gap between clips
  // is where a backgrounded queue stalls.
  // Thinking is an ASIDE: a different voice, quieter, and a shade quicker. The
  // point is that you can tell without listening for it whether the model is
  // reasoning or answering -- otherwise a long chain of thought is
  // indistinguishable from the reply and you cannot tell when the answer starts.
  const aside = role === "thinking";
  const r = await fetch("/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text,
      voice: aside ? (thinkVoiceEl.value || voiceEl.value) : voiceEl.value,
      rate: rate() * (aside ? 1.15 : 1),
      volume: aside ? 0.65 : 1.0,
      ...(speakerRow.style.display !== "none" && !aside
        ? { speaker: parseInt(speakerEl.value, 10) } : {}),
    }),
  });
  if (!r.ok) throw new Error(`tts HTTP ${r.status}: ${(await r.text()).slice(0, 120)}`);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  await new Promise((resolve) => {
    const el = audioEl;          // bind now; a device change may swap the global
    el.src = url;
    // Rate is already baked into the audio by the server; playing it back at
    // anything but 1.0 would apply the speed-up twice.
    el.playbackRate = 1;
    el.onended = el.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    el.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
  });
  console.log(`[voicebox] piper: ${((performance.now() - t0) / 1000).toFixed(2)}s for ${text.length} chars`);
}

// Interrupting matters more than it sounds. A reasoning model can produce
// minutes of speech, and without a way to cut it off the only options are
// waiting it out or reloading the page.
function stopSpeaking() {
  speechSynthesis.cancel();
  audioEl.pause();
  audioEl.currentTime = 0;
  ttsQueue = [];
  ttsPlaying = false;
  speakQueue = "";
  setSpeaking(false);
}

shushBtn.onclick = () => { stopSpeaking(); status("speech stopped"); };
// Esc anywhere, because reaching for a button while something is talking at you
// is exactly the moment you do not want to be aiming a mouse.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!panel.hidden) { setPanel(false); return; }   // panel first, then speech
  stopSpeaking(); status("speech stopped");
});

// Sentences are spoken in order. Kokoro generation is async and a later
// sentence can finish first, so a queue rather than fire-and-forget.
let ttsQueue = [], ttsPlaying = false;

// Keep the newest message visible when the viewport changes size -- the keyboard
// opening or closing, or the device rotating. Re-pinned only if the user was
// already at the bottom: yanking the view down while they are reading back
// through the conversation would be worse than the problem being fixed.
function pinLogIfAtBottom() {
  const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  return () => { if (nearBottom) logEl.scrollTop = logEl.scrollHeight; };
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    const repin = pinLogIfAtBottom();
    // After the browser has finished re-laying out, not during.
    requestAnimationFrame(() => requestAnimationFrame(repin));
  });
}
// Focusing the field is the moment the keyboard appears on a phone.
textEl.addEventListener("focus", () => {
  const repin = pinLogIfAtBottom();
  setTimeout(repin, 300);
});

function setSpeaking(on) {
  shushBtn.disabled = !on;
  shushBtn.classList.toggle("active", on);

  // Declare this as a media session. No permission exists for background audio,
  // but a page Chrome recognises as PLAYING MEDIA is treated very differently
  // from one that merely happens to make noise: it survives being backgrounded,
  // and the reply gets lock-screen and headphone controls for free. Without it
  // a phone is entitled to stop us the moment the tab is hidden.
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.playbackState = on ? "playing" : "none";
    if (on) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "voicebox", artist: modelEl.selectedOptions[0]?.textContent || "reply",
      });
      navigator.mediaSession.setActionHandler("pause", () => { stopSpeaking(); });
      navigator.mediaSession.setActionHandler("stop", () => { stopSpeaking(); });
    }
  } catch { /* metadata is a nicety; never let it break playback */ }
}

async function drainTTS() {
  if (ttsPlaying) return;
  ttsPlaying = true;
  setSpeaking(true);
  while (ttsQueue.length) {
    const { text, role } = ttsQueue.shift();
    try {
      if (ttsEngineEl.value === "piper") await speakPiper(text, role);
      else if (ttsEngineEl.value === "kokoro") await speakKokoro(text);
      else await speakSystem(text, role);
    } catch (e) {
      console.warn("[voicebox] tts:", e);
      status("speech-out failed: " + (e.message || e), "warn");
    }
  }
  ttsPlaying = false;
  setSpeaking(false);
}

function speakSystem(text, role = "reply") {
  return new Promise((resolve) => {
    const aside = role === "thinking";
    const u = new SpeechSynthesisUtterance(text);
    const want = aside ? (thinkVoiceEl.value || voiceEl.value) : voiceEl.value;
    const v = speechSynthesis.getVoices().find((x) => x.name === want);
    if (v) u.voice = v;
    if (aside) { u.volume = 0.65; u.pitch = 0.9; }
    // The spec caps rate at 10 but implementations vary; 2.5 is the useful end.
    u.rate = rate() * (aside ? 1.15 : 1);
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

async function speakKokoro(text) {
  const tts = await ensureKokoro();
  const t0 = performance.now();
  const audio = await tts.generate(text, { voice: voiceEl.value || "af_heart" });
  const gen = (performance.now() - t0) / 1000;
  // Realtime factor: seconds of speech produced per second of compute. Below 1
  // means generation cannot keep up with playback, which is what "too slow"
  // actually means and is the number worth reporting.
  const dur = audio.audio.length / audio.sampling_rate;
  const rtf = dur / gen;
  console.log(`[voicebox] kokoro ${kokoroDevice}: ${dur.toFixed(1)}s audio in ` +
              `${gen.toFixed(1)}s = ${rtf.toFixed(2)}x realtime`);
  if (rtf < 1) status(`Kokoro ${kokoroDevice}: ${rtf.toFixed(2)}x realtime — slower than playback`, "warn");
  const url = URL.createObjectURL(audio.toBlob());
  await new Promise((resolve) => {
    const el = audioEl;
    el.src = url;
    el.playbackRate = rate();
    el.onended = el.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    el.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
  });
}

function speak(text, role = "reply") {
  if (!$("speak").checked) return;
  const clean = speakableText(text);
  // A chunk that was ONLY markup -- a table row, a fence -- has nothing to say.
  if (!clean || !/[a-z0-9]/i.test(clean)) return;
  ttsQueue.push({ text: clean, role });
  drainTTS();
}

// Markdown is written to be READ, not spoken. Piper says "asterisk asterisk"
// for **bold**, spells out URLs character by character, and reads a fenced code
// block line by line including the backticks. None of that carries meaning in
// audio, so the text is cleaned on the way to the synthesiser only -- the
// transcript on screen keeps its formatting.
function speakableText(md) {
  let t = md;
  t = t.replace(/```[\s\S]*?```/g, " (code block) ");       // never read code aloud
  t = t.replace(/~~~[\s\S]*?~~~/g, " (code block) ");
  t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, " ");             // images
  t = t.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1");           // [text](url) -> text
  t = t.replace(/<https?:\/\/[^>]+>/g, " link ");
  t = t.replace(/\bhttps?:\/\/\S+/g, " link ");             // a spoken URL is noise
  t = t.replace(/`([^`]+)`/g, "$1");                        // inline code
  t = t.replace(/(\*\*\*|___)(.+?)\1/g, "$2");              // bold+italic
  t = t.replace(/(\*\*|__)(.+?)\1/g, "$2");                  // bold
  t = t.replace(/(?<![\w*])\*(?!\s)([^*\n]+?)(?<!\s)\*(?![\w*])/g, "$1");  // italic
  t = t.replace(/(?<![\w_])_(?!\s)([^_\n]+?)(?<!\s)_(?![\w_])/g, "$1");
  t = t.replace(/~~(.+?)~~/g, "$1");                        // strikethrough
  t = t.replace(/^\s{0,3}#{1,6}\s+/gm, "");                 // headings
  t = t.replace(/^\s{0,3}>\s?/gm, "");                      // blockquotes
  t = t.replace(/^\s*[-*+]\s+/gm, "");                      // bullets
  t = t.replace(/^\s*\d+\.\s+/gm, "");                      // numbered items keep their text
  t = t.replace(/^\s*\|.*\|\s*$/gm, " ");                   // table rows: unreadable aloud
  t = t.replace(/^\s*[-:|\s]{4,}$/gm, " ");                  // table rules and --- lines
  t = t.replace(/[ \t]{2,}/g, " ");
  return t.replace(/\n{2,}/g, "\n").trim();
}

let speakQueue = "", thinkQueue = "";

// Reasoning is spoken sentence by sentence like the reply, but tagged so the
// synthesiser can give it a different voice.
function speakThinkingStream(delta, flush = false) {
  if (!$("speakThink").checked) return;
  thinkQueue += delta;
  let m;
  while ((m = thinkQueue.match(/^[\s\S]*?[.!?…](\s|$)/))) {
    speak(m[0], "thinking"); thinkQueue = thinkQueue.slice(m[0].length);
  }
  if (flush && thinkQueue.trim()) { speak(thinkQueue, "thinking"); thinkQueue = ""; }
}
// Speak sentence by sentence as the stream arrives, so the reply starts being
// read aloud while it is still being generated.
function speakStreaming(delta, flush = false) {
  speakQueue += delta;
  let m;
  while ((m = speakQueue.match(/^[\s\S]*?[.!?…](\s|$)/))) {
    speak(m[0]); speakQueue = speakQueue.slice(m[0].length);
  }
  if (flush && speakQueue.trim()) { speak(speakQueue); speakQueue = ""; }
}

// --- the turn ---------------------------------------------------------------
async function send(userText, source = "typed") {
  if (busy || !userText.trim()) return;
  busy = true; talkBtn.disabled = true;
  const tag = ($("tagInput").checked && source === "voice") ? "[voice] " : "";
  // The tag goes to the model, not to the transcript on screen: the user knows
  // how they entered it, and echoing the marker back just adds noise.
  addMsg(source === "voice" ? "you 🎤" : "you", userText);
  history.push({ role: "user", content: tag + userText });

  const out = addMsg("bot", "", "partial");
  // Reasoning models (most of what ollama cloud serves) stream a separate
  // `reasoning` field. It is shown, collapsed, but NEVER spoken -- listening to
  // a model deliberate for thirty seconds before it answers is unusable.
  // One thinking block PER ROUND, not per turn. Merging them put the model's
  // post-tool reasoning into a block positioned ABOVE the tool line that caused
  // it, which reads as the tool result arriving after the turn rather than
  // between rounds. curThink is cleared by each tool event so the next
  // reasoning delta opens a fresh block below it.
  curThink = null;
  let full = "", thinking = "";
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json", "X-Voicebox-Backend": backendEl.value,
        // The server persists the turn and fans it out to the other devices. Without the
        // session header it simply does not, and the request behaves exactly as it used to.
        ...(sessionId ? { "X-Voicebox-Session": sessionId, "X-Voicebox-Client": CLIENT_ID } : {}),
      },
      // Built per request rather than stored in history, so toggling the
      // checkbox takes effect immediately instead of only for new conversations.
      body: JSON.stringify(applyEffort({
        model: modelEl.value, stream: true,
        // Read at request time, so toggling it takes effect on the next turn.
        ...($("useTools").checked && SERVER_TOOLS ? { voicebox_tools: true } : {}),
        // buildContext() puts the compaction summary in front of the surviving turns, so
        // turns the summary already covers are not resent. `history` holds only those
        // surviving turns -- the compact event prunes it.
        messages: ($("tagInput").checked && history.some((m) => m.content.startsWith("[voice] ")))
          ? [{ role: "system", content: INPUT_MODE_PREAMBLE }, ...buildContext()]
          : buildContext().map((m) => ({ ...m, content: stripTag(m.content) })),
      })),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE frames are separated by a blank line; a chunk can split one.
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const j = JSON.parse(payload);

            // voicebox's own frames: tool activity the MODEL never sees. Handled
            // before the chat parser so an event is never mistaken for a delta.
            if (j.object === "voicebox.event") {
              handleToolEvent(j, out);
              continue;
            }

            const delta = j.choices?.[0]?.delta || {};
            const think = delta.reasoning ?? delta.reasoning_content;
            if (think) {
              if (!curThink) {
                curThink = document.createElement("details");
                curThink.className = "think";
                curThink.innerHTML = "<summary>thinking…</summary><div></div>";
                out.parentNode.insertBefore(curThink, out);
                thinking = "";        // this block's text, not the turn's
              }
              thinking += think;
              curThink.querySelector("div").textContent = thinking;
              speakThinkingStream(think);
              logEl.scrollTop = logEl.scrollHeight;
            }
            const d = delta.content;
            if (d) {
              // The answer has begun; stop reading the reasoning aloud rather
              // than queueing an aside behind the thing it was preamble to.
              if (!full && thinkQueue) thinkQueue = "";
              full += d;
              if (full.length < 40) full = stripTag(full);   // only ever a prefix
              out.textContent = full;
              out.className = "body";
              if (curThink) curThink.querySelector("summary").textContent =
                `thought for ${thinking.length} chars`;
              logEl.scrollTop = logEl.scrollHeight;
              speakStreaming(d);   // content only -- reasoning is never spoken
            }
          } catch { /* a partial frame; the next chunk completes it */ }
        }
      }
    }
    speakStreaming("", true);
    toolLines.delete("__progress");
    addReplay(out, full);
    history.push({ role: "assistant", content: full, model: modelEl.value });
    status(thinking
      ? `ok — ${full.length} chars (+${thinking.length} thinking, not spoken)`
      : `ok — ${full.length} chars`);
  } catch (e) {
    out.textContent = "⚠ " + e.message;
    out.className = "body";
    status(e.message, "err");
    history.pop();
  } finally {
    busy = false; talkBtn.disabled = false;
  }
}

// --- speech in: engine selection --------------------------------------------
// Chrome's own recogniser is the same Google speech stack behind Gboard's voice
// typing, and since Chrome 139 it can run ON DEVICE, so audio need not leave the
// machine. That is both the best quality available here and the least download:
// the language pack is Chrome's, not ours.
//
// Whisper stays as the portable option -- it works in any browser, and it is the
// only one that keeps working if Chrome's speech service is unavailable.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let webSpeechLocal = false;

async function probeWebSpeech() {
  if (!SR) return null;
  let avail = "unknown";
  try {
    if (typeof SR.available === "function") {
      // Bounded on purpose. This call can simply never settle when the speech
      // service is unreachable, and an unbounded await here hangs the whole boot
      // before the engine list is even built -- the app looks dead over a
      // capability probe that was only ever advisory.
      avail = await Promise.race([
        SR.available({ langs: ["en-US"], processLocally: true }),
        new Promise((r) => setTimeout(() => r("timeout"), 3000)),
      ]);
      webSpeechLocal = avail === "available";
    }
  } catch { /* older Chrome: no static available(); cloud path still works */ }
  return avail;
}

function sttEngine() { return sttEngineEl.value; }

// The button says what it will do, which differs per engine.
function talkLabel() {
  if (sttEngine() === "keyboard") return "⌨ dictate";
  return TOUCH ? "tap to talk" : "hold to talk";
}
function refreshTalkButton() {
  if (!talkBtn.disabled || sttEngine() === "keyboard") talkBtn.textContent = talkLabel();
}

// Web Speech is event-driven and does its own capture, so it does not share the
// MediaRecorder path at all.
function recogniseWebSpeech() {
  return new Promise((resolve, reject) => {
    const r = new SR();
    r.lang = "en-US";
    r.interimResults = true;
    r.continuous = false;
    if ("processLocally" in r) r.processLocally = webSpeechLocal;
    let finalText = "";
    r.onstart = () => status("listening… (speak now)");
    r.onaudiostart = () => console.log("[voicebox] audio capture started");
    r.onspeechstart = () => status("listening… (hearing you)");
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      status("listening… " + (finalText + interim).slice(-60));
    };
    r.onerror = (e) => {
      // These are not interchangeable and the difference is the whole diagnosis:
      // no-speech means the recogniser ran and heard nothing (a mic that is
      // muted, or routed elsewhere); not-allowed is permission; network means
      // the cloud recogniser could not be reached, which on a tailnet-only
      // device is a real possibility.
      const why = {
        "no-speech": "heard nothing — is the mic muted, or picked up by another app?",
        "not-allowed": "microphone permission denied",
        "service-not-allowed": "the browser refused the speech service",
        "audio-capture": "no microphone available",
        "network": "speech service unreachable (needs internet for the cloud recogniser)",
        "aborted": "cancelled",
      }[e.error] || ("speech error: " + e.error);
      console.warn("[voicebox] SpeechRecognition error:", e.error, e);
      reject(new Error(why));
    };
    r.onend = () => { activeRecognition = null; resolve(finalText.trim()); };
    activeRecognition = r;
    r.start();
  });
}
let activeRecognition = null;

async function loadSttEngines() {
  const avail = await probeWebSpeech();
  sttEngineEl.innerHTML = "";

  // The phone already has a very good recogniser: the keyboard's own. Gboard
  // dictation is on-device, better than anything shipped here, and needs no
  // microphone permission from the page at all -- the keyboard owns the mic.
  // So the honest option is to get out of the way and let it type.
  {
    const o = document.createElement("option");
    o.value = "keyboard";
    o.textContent = TOUCH ? "speech: keyboard (Gboard)" : "speech: keyboard dictation";
    o.title = "Use your keyboard's own dictation. The button opens the text " +
              "field; tap the keyboard's microphone. Nothing is recorded by this page.";
    sttEngineEl.appendChild(o);
  }
  if (SR) {
    const o = document.createElement("option");
    o.value = "webspeech";
    o.textContent = webSpeechLocal ? "speech: Chrome (on-device)" : "speech: Chrome (cloud)";
    o.title = webSpeechLocal
      ? "Google's recogniser, running locally — audio does not leave this machine"
      : "Google's recogniser via Chrome's service — audio is sent to Google. "
        + "On-device reported: " + avail;
    sttEngineEl.appendChild(o);
  }
  for (const [k, v] of Object.entries(WHISPER)) {
    const o = document.createElement("option");
    o.value = k; o.textContent = "speech: " + v.label;
    sttEngineEl.appendChild(o);
  }
  const saved = localStorage.getItem("vb.stt");
  if (saved && [...sttEngineEl.options].some((o) => o.value === saved)) sttEngineEl.value = saved;
  // On a touch device the keyboard's recogniser is the better default: it is
  // on-device, it is the one already tuned for this phone, and it avoids asking
  // for a microphone the page does not need.
  else if (TOUCH) sttEngineEl.value = "keyboard";
  else sttEngineEl.value = SR ? "webspeech" : "whisper-tiny";
}

sttEngineEl.onchange = async () => {
  localStorage.setItem("vb.stt", sttEngineEl.value);
  await applySttEngine();
  status("speech engine: " + sttEngineEl.options[sttEngineEl.selectedIndex].textContent);
};

// applySttEngine acquires only what the SELECTED engine needs, and is the single
// place that decides whether the talk button is usable.
async function applySttEngine() {
  const eng = sttEngine();
  const keyboard = eng === "keyboard";

  // In keyboard mode the big button has almost nothing to do: a page cannot
  // raise the keyboard's dictation (no API survives -- x-webkit-speech was
  // removed and nothing replaced it), so all it can do is focus a field you
  // could have tapped yourself. Hiding it and giving the field the whole row is
  // more honest than a large control that only opens a keyboard.
  talkBtn.style.display = keyboard ? "none" : "";
  document.body.classList.toggle("kbd-mode", keyboard);

  if (keyboard) {
    // No microphone, no model. The keyboard owns the mic and the page never
    // touches it -- which is also why this mode needs no permission at all.
    talkBtn.disabled = false;
    talkBtn.textContent = talkLabel();
    textEl.placeholder = "tap here, then the keyboard's 🎤";
    return;
  }
  textEl.placeholder = "…or type here and press Enter";

  if (eng !== "webspeech") {
    STT_MODEL = WHISPER[eng].id;
    transcriber = null;              // reloaded for the newly chosen size
    talkBtn.disabled = true;
    await ensureWhisper();
  }

  // Whisper records through MediaRecorder and needs the mic; Web Speech does its
  // own capture but still needs permission.
  const haveMic = media ? true : await initMic();
  talkBtn.disabled = !haveMic;
  if (haveMic) talkBtn.textContent = talkLabel();
}

// --- tool activity ----------------------------------------------------------
// Silence is much worse in audio than on screen: thirty seconds of nothing while
// a search runs is indistinguishable from a hang when there is no spinner to
// look at. So each call is announced in the aside voice, the same one the
// reasoning uses -- it is the same kind of information, something the model is
// doing rather than something it is telling you.
const TOOL_SAYS = {
  web_search_free: "searching the web",
  web_search_paid: "searching the web",
  memory_save: "saving that to memory",
  memory_search: "checking my memory",
  memory_read: "reading my memory",
  date_now: "checking the date",
};

const toolLines = new Map();   // name -> the element showing its progress
let curThink = null;           // the reasoning block for the CURRENT round
let thinking = "";             // that block's accumulated text

function handleToolEvent(ev, out) {
  if (ev.error) {
    const el = document.createElement("div");
    el.className = "tool failed";
    el.textContent = "⚠ " + ev.error;
    out.parentNode.insertBefore(el, out);
    status(ev.error, "err");
    return;
  }
  // Long runs: show where we are, so a twentieth round is distinguishable from
  // a third. Replaces itself rather than stacking a line per round.
  if (ev.round) {
    let el = toolLines.get("__progress");
    if (!el) {
      el = document.createElement("div");
      el.className = "tool";
      out.parentNode.insertBefore(el, out);
      toolLines.set("__progress", el);
    }
    el.textContent = `· round ${ev.round}, ${ev.calls} tool calls so far`;
    return;
  }
  if (ev.notice) {
    const el = document.createElement("div");
    el.className = "tool";
    el.textContent = "· " + ev.notice;
    out.parentNode.insertBefore(el, out);
    return;
  }
  const t = ev.tool;
  if (!t) return;

  // A tool call ends the current round's reasoning. Closing the block here is
  // what keeps the display in the order things actually happened:
  // think -> tool -> think -> answer.
  if (curThink) {
    curThink.querySelector("summary").textContent = `thought for ${thinking.length} chars`;
    curThink = null;
  }

  if (t.phase === "start") {
    const el = document.createElement("div");
    el.className = "tool running";
    const detail = t.args && Object.keys(t.args).length
      ? " " + JSON.stringify(t.args).slice(0, 90) : "";
    el.textContent = "🔧 " + t.name + detail;
    out.parentNode.insertBefore(el, out);
    toolLines.set(t.name, el);
    speak(TOOL_SAYS[t.name] || ("using " + t.name.replace(/_/g, " ")), "thinking");
    logEl.scrollTop = logEl.scrollHeight;
    return;
  }

  const el = toolLines.get(t.name);
  if (el) {
    el.classList.remove("running");
    if (!t.ok) el.classList.add("failed");
    el.textContent = (t.ok ? "🔧 " : "⚠ ") + t.name + " — " + (t.summary || (t.ok ? "done" : "failed"));
    toolLines.delete(t.name);
  }
  // A failure is spoken; a success is not. The answer that follows IS the
  // report, and narrating every success would double the talking.
  if (!t.ok) speak(t.name.replace(/_/g, " ") + " failed", "thinking");
  logEl.scrollTop = logEl.scrollHeight;
}

// addReplay puts a speak-again control under a finished reply.
//
// Independently useful, and the honest answer to a tab that was backgrounded
// mid-sentence: the audio is generated on demand, so replaying costs a round
// trip and nothing was stored. Added only when there is something to say and
// only once per turn.
function addReplay(out, text) {
  if (!text || !text.trim() || !out.parentNode) return;
  if (out.parentNode.querySelector(".replay")) return;
  const b = document.createElement("button");
  b.className = "replay";
  b.textContent = "🔊 replay";
  b.title = "Speak this reply again";
  b.onclick = () => {
    stopSpeaking();
    // Bypasses the "speak replies" checkbox on purpose: pressing replay IS the
    // request, and refusing because a global toggle is off would be obtuse.
    for (const part of splitForSpeech(text)) ttsQueue.push({ text: part, role: "reply" });
    drainTTS();
  };
  out.parentNode.appendChild(b);
}

// splitForSpeech breaks a reply into the same sentence-sized pieces the live
// stream uses, so a replay sounds identical to the original.
function splitForSpeech(md) {
  const clean = speakableText(md);
  if (!clean) return [];
  const out = [];
  let rest = clean, m;
  while ((m = rest.match(/^[\s\S]*?[.!?…](\s|$)/))) {
    out.push(m[0]); rest = rest.slice(m[0].length);
  }
  if (rest.trim()) out.push(rest);
  return out.filter((p) => /[a-z0-9]/i.test(p));
}

// --- microphone -------------------------------------------------------------
// initMic checks that the microphone is USABLE without keeping it.
//
// Holding the stream open was a real bug: an open capture on Android blocks
// every other consumer, so the keyboard's own dictation reported "another device
// is using the microphone" purely because this page had grabbed it at load and
// never let go. Permission is checked by opening and immediately releasing; the
// actual recording acquires its own stream and releases it again at the end.
async function initMic() {
  if (!navigator.mediaDevices?.getUserMedia) {
    status("no microphone API — this origin is not a secure context. Use https, or see README.", "err");
    talkBtn.textContent = "no mic";
    return false;
  }
  try {
    releaseMic(await navigator.mediaDevices.getUserMedia({ audio: true }));
    return true;
  } catch (e) {
    status("microphone blocked: " + e.message, "err");
    talkBtn.textContent = "no mic";
    return false;
  }
}

// releaseMic stops every track, which is what actually hands the device back.
// Dropping the reference is not enough -- the capture stays live until the
// tracks are stopped.
function releaseMic(stream) {
  if (!stream) return;
  for (const t of stream.getTracks()) {
    try { t.stop(); } catch { /* already ended */ }
  }
  if (stream === media) media = null;
}

async function startRec() {
  if (busy) return;
  stopSpeaking();                       // barge-in: talking over the reply stops it

  if (sttEngine() === "webspeech") {
    talkBtn.classList.add("rec");
    talkBtn.textContent = TOUCH ? "tap when done" : "release to send";
    status("listening…");
    webSpeechPromise = recogniseWebSpeech();
    return;
  }

  // Acquired per take and released in stopRec, so the microphone is only held
  // while actually recording.
  try {
    media = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    recording = false;
    status("microphone unavailable: " + e.message +
           " — another app may have it; the keyboard engine avoids this entirely", "err");
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(media);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.start();
  talkBtn.classList.add("rec");
  talkBtn.textContent = TOUCH ? "tap when done" : "release to send";
  status("listening…");
}

let webSpeechPromise = null;

async function stopRec() {
  if (sttEngine() === "webspeech") {
    talkBtn.classList.remove("rec");
    talkBtn.textContent = TOUCH ? "tap to talk" : "hold to talk";
    if (!webSpeechPromise) return;
    status("finishing…");
    try { activeRecognition?.stop(); } catch { /* already stopping */ }
    try {
      const text = (await webSpeechPromise).trim();
      webSpeechPromise = null;
      if (!text) { status("heard nothing"); return; }
      status("transcribed");
      if ($("autosend").checked) send(text, "voice");
      else { textEl.value = text; status("transcribed — press Enter to send"); }
    } catch (e) {
      webSpeechPromise = null;
      status(e.message, "err");
    }
    return;
  }

  if (!recorder || recorder.state === "inactive") return;
  const done = new Promise((res) => (recorder.onstop = res));
  recorder.stop();
  await done;
  releaseMic(media);   // hand the device back before transcribing, not after
  talkBtn.classList.remove("rec");
  talkBtn.textContent = TOUCH ? "tap to talk" : "hold to talk";
  status("transcribing…");

  talkBtn.disabled = true;
  // A stalled transcription used to be indistinguishable from a crashed one.
  // Ticking the elapsed time makes "slow" and "stuck" tell themselves apart.
  const t0 = performance.now();
  const tick = setInterval(
    () => status(`transcribing… ${((performance.now() - t0) / 1000).toFixed(1)}s`), 200);
  try {
    const blob = new Blob(chunks, { type: recorder.mimeType });
    if (!blob.size) throw new Error("recorder produced no audio");
    const buf = await blob.arrayBuffer();

    // Whisper wants 16 kHz mono float32. decodeAudioData resamples into the
    // context's rate, so the context is created at 16 kHz rather than resampling
    // by hand afterwards.
    const ctx = new AudioContext({ sampleRate: 16000 });
    let audio;
    try { audio = await ctx.decodeAudioData(buf); }
    finally { await ctx.close(); }
    const pcm = audio.getChannelData(0);
    if (pcm.length < 1600) throw new Error(`only ${(pcm.length / 16000).toFixed(2)}s of audio — hold or tap for longer`);
    // A silent take is a muted or misrouted mic, not a transcription failure,
    // and the two need different fixes. Peak amplitude tells them apart.
    let peak = 0;
    for (let i = 0; i < pcm.length; i++) { const a = Math.abs(pcm[i]); if (a > peak) peak = a; }
    console.log(`[voicebox] captured ${(pcm.length / 16000).toFixed(2)}s, peak ${peak.toFixed(4)}`);
    if (peak < 0.005) throw new Error(`mic captured ${(pcm.length / 16000).toFixed(1)}s of near-silence (peak ${peak.toFixed(4)}) — muted or another app has it?`);

    await ensureWhisper();
