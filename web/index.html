<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voicebox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13; --panel: #151922; --edge: #262c38;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #57c7a8; --accent-dim: #2f6e5e;
    --rec: #e05555; --warn: #e0a955;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column;
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #crumb {
    flex: 1; min-width: 0; font: 12px/1.4 var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #gear { font-size: 17px; line-height: 1; padding: 6px 11px; }

  /* Settings live in a panel because there are now thirteen of them; a single
     bar of controls had stopped being scannable and did not fit a narrow window
     at all. */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 10;
    background: var(--panel); border-left: 1px solid var(--edge);
    overflow-y: auto; padding-bottom: 24px;
    box-shadow: -18px 0 40px rgba(0,0,0,.45);
  }
  #panel[hidden], #scrim[hidden] { display: none; }
  .phead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--edge);
    position: sticky; top: 0; background: var(--panel); font-weight: 600;
  }
  #panel section { padding: 14px 16px; border-bottom: 1px solid var(--edge); }
  #panel h2 {
    font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 11px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .row > span:first-child { flex: 0 0 96px; font-size: 13px; color: var(--muted); }
  .row select { flex: 1; min-width: 0; }
  .row .rate { flex: 1; display: flex; align-items: center; gap: 8px; }
  .row .rate input { flex: 1; }
  #rateVal { font: 12px var(--mono); min-width: 3.2em; }
  #panel .chk { margin-bottom: 8px; align-items: flex-start; line-height: 1.35; }
  #panel .chk input { margin-top: 2px; }
  #clear { width: 100%; }
  select, button, input {
    background: #1b212c; color: var(--text); border: 1px solid var(--edge);
    border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 13px;
  }
  select:hover, button:hover { border-color: #3a4356; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  label.chk { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  input[type=range] { accent-color: var(--accent); padding: 0; }
  #log { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 780px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  .who {
    flex: 0 0 52px; font: 600 11px/1.8 var(--mono); letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); padding-top: 2px;
  }
  .msg.you .who { color: var(--accent); }
  .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; }
  .body.partial { color: var(--muted); font-style: italic; }
  .think {
    border-left: 2px solid var(--edge); padding: 4px 0 4px 10px; margin-bottom: 8px;
    color: var(--muted); font-size: 13px; white-space: pre-wrap; max-height: 8.5em; overflow-y: auto;
  }
  .think summary { cursor: pointer; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  footer {
    border-top: 1px solid var(--edge); background: var(--panel);
    padding: 12px 14px; display: flex; gap: 10px; align-items: center;
  }
  #talk {
    flex: 0 0 auto; padding: 12px 26px; font-size: 15px; font-weight: 600;
    border-color: var(--accent-dim); background: #18241f;
  }
  #talk.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
  #shush { flex: 0 0 auto; padding: 12px 16px; font-size: 15px; }
  #shush.active { border-color: var(--rec); color: var(--rec); }
  #text { flex: 1; }
  #status { font: 12px/1.4 var(--mono); color: var(--muted); padding: 6px 16px; border-top: 1px solid var(--edge); }
  #status.err { color: var(--rec); }
  #status.warn { color: var(--warn); }
  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>voicebox</h1>
  <!-- What you are talking to, at a glance. The settings live behind the panel
       now, so without this there is no way to see which model is answering
       without opening it. -->
  <div id="crumb" title="current backend · model · voice"></div>
  <button id="gear" aria-label="Settings" aria-expanded="false">☰</button>
</header>

<div id="log"></div>

<footer>
  <button id="talk" disabled>loading…</button>
  <button id="shush" title="Stop speaking (Esc)" disabled>⏹</button>
  <input id="text" placeholder="…or type here and press Enter" />
</footer>

<div id="scrim" hidden></div>
<aside id="panel" hidden aria-label="Settings">
  <div class="phead"><span>Settings</span><button id="panelClose" aria-label="Close">✕</button></div>

  <section>
    <h2>Chat</h2>
    <label class="row"><span>Server</span><select id="backend"></select></label>
    <label class="row"><span>Model</span><select id="model"></select></label>
    <label class="row" id="effortRow"><span>Thinking</span><select id="effort"></select></label>
    <label class="chk"><input type="checkbox" id="tagInput" checked />
      Tell the model when a message was dictated</label>
  </section>

  <section>
    <h2>Speech in</h2>
    <label class="row"><span>Recogniser</span><select id="sttEngine"></select></label>
    <label class="chk"><input type="checkbox" id="autosend" checked />
      Send as soon as I stop talking</label>
  </section>

  <section>
    <h2>Speech out</h2>
    <label class="chk"><input type="checkbox" id="speak" checked /> Speak replies</label>
    <label class="row"><span>Engine</span><select id="ttsEngine">
      <option value="piper">Piper (server)</option>
      <option value="system">system</option>
      <option value="kokoro">Kokoro (in-browser)</option>
    </select></label>
    <label class="row"><span>Voice</span><select id="voice"></select></label>
    <label class="row"><span>Speed</span>
      <span class="rate"><input type="range" id="rate" min="0.5" max="2.5" step="0.05" value="1" />
      <span id="rateVal">1.00x</span></span></label>
    <label class="chk"><input type="checkbox" id="speakThink" />
      Read the reasoning aloud, as an aside</label>
    <label class="row" id="thinkVoiceRow"><span>Aside voice</span><select id="thinkVoice"></select></label>
  </section>

  <section>
    <button id="clear">Clear conversation</button>
  </section>
</aside>

<div id="status">starting</div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4";

// ---------------------------------------------------------------------------
// Speech in. A small dedicated recogniser, not a multimodal LLM: whisper-tiny
// is ~40 MB where Gemma's audio path drags the whole 3.4 GB model in with it.
// Runs on WebGPU when the adapter allows and falls back to WASM, which is
// perfectly usable at this size.
// ---------------------------------------------------------------------------
// Whisper sizes, smallest first. tiny is fast and mediocre; base and small are
// noticeably better English and still trivial next to a 4B multimodal model.
const WHISPER = {
  "whisper-tiny":  { id: "onnx-community/whisper-tiny.en",  label: "Whisper tiny (~40 MB)" },
  "whisper-base":  { id: "onnx-community/whisper-base.en",  label: "Whisper base (~80 MB)" },
  "whisper-small": { id: "onnx-community/whisper-small.en", label: "Whisper small (~250 MB)" },
};
let STT_MODEL = WHISPER["whisper-tiny"].id;

// The page is served cross-origin-isolated, so SharedArrayBuffer exists and
// onnxruntime can run WASM on several threads. Capped well below the core count
// on purpose: whisper-tiny is small enough that past a handful of threads the
// synchronisation costs more than the parallelism returns, and this box reports
// 40 cores.
env.backends.onnx.wasm.numThreads = Math.max(1, Math.min(8, navigator.hardwareConcurrency || 4));

// onnxruntime loads several sub-models under Promise.all; when one backend is
// unavailable, siblings can reject after the failure has already been handled.
// Those are noise, not faults -- log them, do not let them read as a crash.
window.addEventListener("unhandledrejection", (e) => {
  const m = e.reason?.message || String(e.reason);
  console.warn("[voicebox] late rejection:", e.reason);
  // Shown, never swallowed. Suppressing these once hid a real transcription
  // failure behind a status line that simply said "transcribing…" forever.
  const el = document.getElementById("status");
  if (el && !el.classList.contains("err")) { el.textContent = "async: " + m; el.className = "warn"; }
});

const $ = (id) => document.getElementById(id);
const logEl = $("log"), statusEl = $("status");
const backendEl = $("backend"), modelEl = $("model"), voiceEl = $("voice");
const sttEngineEl = $("sttEngine"), effortEl = $("effort");
const thinkVoiceEl = $("thinkVoice"), shushBtn = $("shush");

// --- settings panel ----------------------------------------------------------
const panel = $("panel"), scrim = $("scrim");
function setPanel(open) {
  panel.hidden = !open;
  scrim.hidden = !open;
  $("gear").setAttribute("aria-expanded", String(open));
}
$("gear").onclick = () => setPanel(panel.hidden);
$("panelClose").onclick = () => setPanel(false);
scrim.onclick = () => setPanel(false);

// crumb: the one thing that must stay visible once the controls are hidden --
// otherwise there is no way to tell which model just answered you.
function updateCrumb() {
  const model = (modelEl.value || "").split("/").pop() || "no model";
  const bits = [backendEl.selectedOptions[0]?.textContent || backendEl.value, model];
  if ($("speak").checked) {
    const v = voiceEl.selectedOptions[0]?.textContent || "";
    if (v) bits.push(v.split("·")[0].trim());
  }
  if (effortEl.style.display !== "none" && effortEl.value) bits.push(effortEl.value);
  $("crumb").textContent = bits.filter(Boolean).join("  ·  ");
}
const talkBtn = $("talk"), textEl = $("text");

// Telling the model that a message was dictated helps it read past recogniser
// artefacts -- homophones, mangled proper nouns, missing punctuation.
//
// Only VOICE is tagged, and the note is deliberately terse. A longer version
// that also tagged [typed] and explained both cases made a small model (granite
// 1b) misbehave in two measured ways: it echoed the marker into its own replies
// ("[typed] As of 2023..."), and once it commented on the phrasing of a message
// it kept doing so for the rest of the conversation, escalating to suggesting
// rephrasings instead of answering. Absence of a tag carries "typed" perfectly
// well, and saying less gives a weak model less to imitate.
const INPUT_MODE_PREAMBLE =
  "A message beginning with [voice] was dictated by speech recognition and may " +
  "contain misheard words. Answer it normally. Never write [voice] yourself and " +
  "never remark on how the message was entered or worded.";

// A small model may still echo the marker. Strip it rather than show it.
const stripTag = (t) => t.replace(/^\s*\[(voice|typed)\]\s*/i, "");

let transcriber = null;
// Probed once and shared. Both models want the same answer, and requesting an
// adapter twice is pointless -- but it must be probed rather than assumed: see
// the note in ensureWhisper about navigator.gpu existing on machines that will
// not hand one out.
let GPU_DEVICE = null;
async function pickDevice() {
  if (GPU_DEVICE) return GPU_DEVICE;
  GPU_DEVICE = "wasm";
  if (navigator.gpu) {
    try {
      const a = await navigator.gpu.requestAdapter();
      if (a) GPU_DEVICE = "webgpu";
    } catch { /* stays wasm */ }
  }
  return GPU_DEVICE;
}
let media = null, recorder = null, chunks = [];
let history = [];
let busy = false;
let BUILD = "?";
let SERVER_TTS = false;

function status(msg, kind = "") { statusEl.textContent = msg; statusEl.className = kind; }

function addMsg(who, text, cls = "") {
  const row = document.createElement("div");
  row.className = "msg " + (who === "you" ? "you" : "");
  row.innerHTML = `<div class="who">${who}</div><div class="body ${cls}"></div>`;
  row.querySelector(".body").textContent = text;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  return row.querySelector(".body");
}

// --- backends ---------------------------------------------------------------
async function loadBackends() {
  const r = await fetch("/api/backends");
  const d = await r.json();
  backendEl.innerHTML = "";
  for (const b of d.backends) {
    const o = document.createElement("option");
    o.value = b.id;
    o.textContent = b.label + (b.needs_key && !b.has_key ? "  (no key)" : "");
    o.disabled = b.needs_key && !b.has_key;
    backendEl.appendChild(o);
  }
  BUILD = d.build || "?";
  SERVER_TTS = !!d.server_tts;
  console.log("[voicebox] page build", BUILD);
  backendEl.value = localStorage.getItem("vb.backend") || d.default;
  await loadModels();
}

async function loadModels() {
  modelEl.innerHTML = `<option>loading…</option>`;
  try {
    const r = await fetch("/v1/models", { headers: { "X-Voicebox-Backend": backendEl.value } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const ids = (d.data || d.models || []).map((m) => m.id || m.name || m.model).filter(Boolean);
    modelEl.innerHTML = "";
    for (const id of ids.sort()) {
      const o = document.createElement("option");
      o.value = id;
      // A gguf path is unreadable in a dropdown; the filename is the identity.
      o.textContent = id.split("/").pop();
      o.title = id;
      modelEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.model." + backendEl.value);
    if (saved && ids.includes(saved)) modelEl.value = saved;
    if (!ids.length) modelEl.innerHTML = `<option value="">(server listed none)</option>`;
  } catch (e) {
    modelEl.innerHTML = `<option value="">(unreachable)</option>`;
    status(`${backendEl.value}: ${e.message}`, "err");
  }
}

backendEl.onchange = async () => {
  localStorage.setItem("vb.backend", backendEl.value);
  await loadModels();
  await loadEffort();
  updateCrumb();
};
modelEl.onchange = () => {
  localStorage.setItem("vb.model." + backendEl.value, modelEl.value);
  updateCrumb();
  // Reasoning support is a property of the WEIGHTS, not the server, so it has
  // to be re-asked whenever the model changes.
  loadEffort();
};

// --- how hard the model should think --------------------------------------
// The control is discovered, not assumed: the server interrogates the backend
// (llama.cpp /props, ollama /api/show) and reports which mechanism, if any, that
// model actually honours. Different families spell this differently and most
// models have no such knob at all, so a fixed dropdown would be wrong more often
// than right. Hidden entirely when nothing is supported.
let effortKnob = { kind: "none" };

async function loadEffort() {
  effortKnob = { kind: "none" };
  effortEl.style.display = "none";
  $("effortRow").style.display = "none";
  try {
    const q = new URLSearchParams({ backend: backendEl.value, model: modelEl.value || "" });
    const r = await fetch("/api/effort?" + q);
    if (!r.ok) return;
    effortKnob = await r.json();
    if (effortKnob.kind === "none" || !(effortKnob.levels || []).length) return;

    effortEl.innerHTML = "";
    const auto = document.createElement("option");
    auto.value = ""; auto.textContent = "think: default";
    effortEl.appendChild(auto);
    effortKnob.levels.forEach((lv, i) => {
      const o = document.createElement("option");
      o.value = lv;
      o.textContent = "think: " + (effortKnob.labels?.[i] || lv);
      effortEl.appendChild(o);
    });
    effortEl.title = effortKnob.source + "  (" +
      (effortKnob.kind === "reasoning_effort"
        ? "sent as reasoning_effort"
        : "sent as chat_template_kwargs." + effortKnob.variable) + ")";
    const saved = localStorage.getItem("vb.effort." + backendEl.value);
    if (saved && effortKnob.levels.includes(saved)) effortEl.value = saved;
    effortEl.style.display = "";
    $("effortRow").style.display = "";
  } catch { /* no control offered; the dropdown stays hidden */ }
}

effortEl.onchange = () => { localStorage.setItem("vb.effort." + backendEl.value, effortEl.value); updateCrumb(); };

// The aside voice is picked from the same list as the main one; defaulting to a
// DIFFERENT entry is the whole point, so the two are told apart by ear.
function syncThinkVoices() {
  const on = $("speakThink").checked;
  $("thinkVoiceRow").style.display = on ? "" : "none";
  if (!on) return;
  const opts = [...voiceEl.options].map((o) => ({ v: o.value, t: o.textContent }));
  thinkVoiceEl.innerHTML = "";
  for (const o of opts) {
    const e = document.createElement("option");
    e.value = o.v; e.textContent = "think: " + o.t;
    thinkVoiceEl.appendChild(e);
  }
  const saved = localStorage.getItem("vb.thinkvoice");
  if (saved && opts.some((o) => o.v === saved)) thinkVoiceEl.value = saved;
  else {
    const other = opts.find((o) => o.v !== voiceEl.value);
    if (other) thinkVoiceEl.value = other.v;
  }
}
thinkVoiceEl.onchange = () => localStorage.setItem("vb.thinkvoice", thinkVoiceEl.value);
$("speakThink").onchange = () => {
  localStorage.setItem("vb.speakthink", $("speakThink").checked ? "1" : "0");
  syncThinkVoices();
  if (!$("speakThink").checked) thinkQueue = "";
};

// applyEffort adds whichever field this model actually reads.
function applyEffort(body) {
  const lv = effortEl.value;
  if (!lv || effortKnob.kind === "none") return body;
  if (effortKnob.kind === "reasoning_effort") {
    body.reasoning_effort = lv;
  } else if (effortKnob.kind === "chat_template_kwargs") {
    // The value must be the JSON TYPE the template expects, not a string that
    // looks like it. llama.cpp validates: sending "true" for a boolean knob is
    // rejected outright with
    //   invalid type for "enable_thinking" (expected boolean, got string)
    // so a boolean level is converted rather than passed through.
    const val = lv === "true" ? true : lv === "false" ? false : lv;
    body.chat_template_kwargs = { ...(body.chat_template_kwargs || {}), [effortKnob.variable]: val };
  }
  return body;
}

// --- speech out -------------------------------------------------------------
// Two engines. The system synthesiser is free and instant but on Linux it is
// the espeak family, which is what "not great" sounds like. Kokoro is an 86 MB
// ONNX model with 55 voices, loaded only when selected, and only the chosen
// voice file (~520 KB) is fetched on top of the model.
const KOKORO_MODEL = "onnx-community/Kokoro-82M-v1.0-ONNX";
let kokoro = null, kokoroVoices = null, kokoroLoading = null, kokoroDevice = "?";

const rateEl = $("rate"), rateValEl = $("rateVal");
const ttsEngineEl = $("ttsEngine");
let audioEl = new Audio();   // one element, so a new utterance replaces the old

function rate() { return parseFloat(rateEl.value) || 1; }
rateEl.oninput = () => {
  rateValEl.textContent = rate().toFixed(2) + "x";
  localStorage.setItem("vb.rate", rateEl.value);
  // Kokoro output is an <audio> element, so speed applies live to what is
  // already playing. The system synthesiser can only take a rate at the moment
  // an utterance starts.
  if (ttsEngineEl.value !== "piper") audioEl.playbackRate = rate();
};
rateEl.value = localStorage.getItem("vb.rate") || "1";
rateValEl.textContent = rate().toFixed(2) + "x";

function loadSystemVoices() {
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  voiceEl.innerHTML = "";
  for (const v of vs) {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    voiceEl.appendChild(o);
  }
  const saved = localStorage.getItem("vb.voice.system");
  if (saved && vs.some((v) => v.name === saved)) voiceEl.value = saved;
}

async function ensureKokoro() {
  if (kokoro) return kokoro;
  if (kokoroLoading) return kokoroLoading;
  // On failure the in-flight promise MUST be cleared. Memoising a rejected
  // promise means the first failure is replayed verbatim on every later attempt,
  // so a fixed page still reports the old error until a full reload -- which is
  // indistinguishable from the fix not working.
  kokoroLoading = (async () => {
    status("loading Kokoro voice model (86 MB, cached after the first run)…");
    const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
    const dev = await pickDevice();
    // fp32 on the GPU, q8 on the CPU: quantised weights buy nothing once the
    // work is on a GPU, and the fp32 graph is the better-supported path there.
    kokoro = await KokoroTTS.from_pretrained(KOKORO_MODEL, {
      dtype: dev === "webgpu" ? "fp32" : "q8", device: dev,
      progress_callback: (p) => {
        if (p.status === "progress" && p.total)
          status(`Kokoro ${(100 * p.loaded / p.total).toFixed(0)}% (${p.file})`);
      },
    });
    // NOT list_voices(): that method only does console.table() and returns
    // undefined. The voices getter is the actual data, keyed by voice id, with
    // {name, language, gender, overallGrade} per entry.
    kokoroVoices = kokoro.voices || {};
    kokoroDevice = dev;
    status(`Kokoro ready on ${dev} — ${Object.keys(kokoroVoices).length} voices`);
    return kokoro;
  })().catch((e) => { kokoroLoading = null; kokoro = null; throw e; });
  return kokoroLoading;
}

async function loadKokoroVoices() {
  voiceEl.innerHTML = `<option>loading…</option>`;
  try {
    await ensureKokoro();
    const ids = Object.keys(kokoroVoices);
    if (!ids.length) throw new Error("model loaded but exposed no voices");

    // Kokoro grades its own voices A..F and most of them are middling. Sorting
    // by grade puts the ones actually worth listening to at the top, rather
    // than making you audition 55 alphabetically.
    const grade = (id) => {
      const g = kokoroVoices[id].overallGrade || "F";
      return "ABCDEF".indexOf(g[0]) * 3 - (g.includes("+") ? 1 : 0);
    };
    ids.sort((a, b) => grade(a) - grade(b) || a.localeCompare(b));

    voiceEl.innerHTML = "";
    for (const id of ids) {
      const v = kokoroVoices[id];
      const o = document.createElement("option");
      o.value = id;
      o.textContent = `${v.name} · ${v.gender?.[0] || "?"} · ${v.language} · ${v.overallGrade}`;
      o.title = id;
      voiceEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.voice.kokoro");
    if (saved && ids.includes(saved)) voiceEl.value = saved;
    else if (ids.includes("af_heart")) voiceEl.value = "af_heart";
  } catch (e) {
    voiceEl.innerHTML = `<option value="">(Kokoro failed)</option>`;
    status("Kokoro unavailable: " + e.message, "err");
    ttsEngineEl.value = "system";
    loadSystemVoices();
  }
}

speechSynthesis.onvoiceschanged = () => { if (ttsEngineEl.value === "system") loadSystemVoices(); };
voiceEl.onchange = () => { localStorage.setItem("vb.voice." + ttsEngineEl.value, voiceEl.value); updateCrumb(); };
ttsEngineEl.onchange = async () => {
  localStorage.setItem("vb.tts", ttsEngineEl.value);
  stopSpeaking();
  if (ttsEngineEl.value === "piper") await loadPiperVoices();
  else if (ttsEngineEl.value === "kokoro") await loadKokoroVoices();
  else loadSystemVoices();
};

// Piper runs on the server, so the browser downloads nothing and the speed is
// independent of whatever the browser can negotiate with the GPU. Rate is applied
// at SYNTHESIS (length_scale) rather than by resampling, so faster speech does
// not come out pitch-shifted the way playbackRate makes it.
let piperVoices = [];

async function loadPiperVoices() {
  voiceEl.innerHTML = `<option>loading…</option>`;
  try {
    const r = await fetch("/voices");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    piperVoices = (await r.json()).voices || [];
    if (!piperVoices.length) throw new Error("service has no voices installed");
    voiceEl.innerHTML = "";
    for (const v of piperVoices) {
      const o = document.createElement("option");
      o.value = v.id;
      o.textContent = `${v.name} · ${v.lang.replace("_", "-")} · ${v.quality}`;
      o.title = v.id;
      voiceEl.appendChild(o);
    }
    const saved = localStorage.getItem("vb.voice.piper");
    if (saved && piperVoices.some((v) => v.id === saved)) voiceEl.value = saved;
    syncThinkVoices();
    updateCrumb();
    status(`Piper ready — ${piperVoices.length} voices, on the server`);
  } catch (e) {
    voiceEl.innerHTML = `<option value="">(unavailable)</option>`;
    status("Piper unavailable: " + e.message + " — falling back to system voices", "warn");
    ttsEngineEl.value = "system";
    loadSystemVoices();
  }
}

async function speakPiper(text, role = "reply") {
  const t0 = performance.now();
  // Thinking is an ASIDE: a different voice, quieter, and a shade quicker. The
  // point is that you can tell without listening for it whether the model is
  // reasoning or answering -- otherwise a long chain of thought is
  // indistinguishable from the reply and you cannot tell when the answer starts.
  const aside = role === "thinking";
  const r = await fetch("/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text,
      voice: aside ? (thinkVoiceEl.value || voiceEl.value) : voiceEl.value,
      rate: rate() * (aside ? 1.15 : 1),
      volume: aside ? 0.65 : 1.0,
    }),
  });
  if (!r.ok) throw new Error(`tts HTTP ${r.status}: ${(await r.text()).slice(0, 120)}`);
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  await new Promise((resolve) => {
    audioEl.src = url;
    // Rate is already baked into the audio by the server; playing it back at
    // anything but 1.0 would apply the speed-up twice.
    audioEl.playbackRate = 1;
    audioEl.onended = audioEl.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    audioEl.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
  });
  console.log(`[voicebox] piper: ${((performance.now() - t0) / 1000).toFixed(2)}s for ${text.length} chars`);
}

// Interrupting matters more than it sounds. A reasoning model can produce
// minutes of speech, and without a way to cut it off the only options are
// waiting it out or reloading the page.
function stopSpeaking() {
  speechSynthesis.cancel();
  audioEl.pause();
  audioEl.currentTime = 0;
  ttsQueue = [];
  ttsPlaying = false;
  speakQueue = "";
  setSpeaking(false);
}

shushBtn.onclick = () => { stopSpeaking(); status("speech stopped"); };
// Esc anywhere, because reaching for a button while something is talking at you
// is exactly the moment you do not want to be aiming a mouse.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!panel.hidden) { setPanel(false); return; }   // panel first, then speech
  stopSpeaking(); status("speech stopped");
});

// Sentences are spoken in order. Kokoro generation is async and a later
// sentence can finish first, so a queue rather than fire-and-forget.
let ttsQueue = [], ttsPlaying = false;

function setSpeaking(on) {
  shushBtn.disabled = !on;
  shushBtn.classList.toggle("active", on);
}

async function drainTTS() {
  if (ttsPlaying) return;
  ttsPlaying = true;
  setSpeaking(true);
  while (ttsQueue.length) {
    const { text, role } = ttsQueue.shift();
    try {
      if (ttsEngineEl.value === "piper") await speakPiper(text, role);
      else if (ttsEngineEl.value === "kokoro") await speakKokoro(text);
      else await speakSystem(text, role);
    } catch (e) {
      console.warn("[voicebox] tts:", e);
      status("speech-out failed: " + (e.message || e), "warn");
    }
  }
  ttsPlaying = false;
  setSpeaking(false);
}

function speakSystem(text, role = "reply") {
  return new Promise((resolve) => {
    const aside = role === "thinking";
    const u = new SpeechSynthesisUtterance(text);
    const want = aside ? (thinkVoiceEl.value || voiceEl.value) : voiceEl.value;
    const v = speechSynthesis.getVoices().find((x) => x.name === want);
    if (v) u.voice = v;
    if (aside) { u.volume = 0.65; u.pitch = 0.9; }
    // The spec caps rate at 10 but implementations vary; 2.5 is the useful end.
    u.rate = rate() * (aside ? 1.15 : 1);
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

async function speakKokoro(text) {
  const tts = await ensureKokoro();
  const t0 = performance.now();
  const audio = await tts.generate(text, { voice: voiceEl.value || "af_heart" });
  const gen = (performance.now() - t0) / 1000;
  // Realtime factor: seconds of speech produced per second of compute. Below 1
  // means generation cannot keep up with playback, which is what "too slow"
  // actually means and is the number worth reporting.
  const dur = audio.audio.length / audio.sampling_rate;
  const rtf = dur / gen;
  console.log(`[voicebox] kokoro ${kokoroDevice}: ${dur.toFixed(1)}s audio in ` +
              `${gen.toFixed(1)}s = ${rtf.toFixed(2)}x realtime`);
  if (rtf < 1) status(`Kokoro ${kokoroDevice}: ${rtf.toFixed(2)}x realtime — slower than playback`, "warn");
  const url = URL.createObjectURL(audio.toBlob());
  await new Promise((resolve) => {
    audioEl.src = url;
    audioEl.playbackRate = rate();
    audioEl.onended = audioEl.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    audioEl.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
  });
}

function speak(text, role = "reply") {
  if (!$("speak").checked) return;
  const clean = speakableText(text);
  // A chunk that was ONLY markup -- a table row, a fence -- has nothing to say.
  if (!clean || !/[a-z0-9]/i.test(clean)) return;
  ttsQueue.push({ text: clean, role });
  drainTTS();
}

// Markdown is written to be READ, not spoken. Piper says "asterisk asterisk"
// for **bold**, spells out URLs character by character, and reads a fenced code
// block line by line including the backticks. None of that carries meaning in
// audio, so the text is cleaned on the way to the synthesiser only -- the
// transcript on screen keeps its formatting.
function speakableText(md) {
  let t = md;
  t = t.replace(/```[\s\S]*?```/g, " (code block) ");       // never read code aloud
  t = t.replace(/~~~[\s\S]*?~~~/g, " (code block) ");
  t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, " ");             // images
  t = t.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1");           // [text](url) -> text
  t = t.replace(/<https?:\/\/[^>]+>/g, " link ");
  t = t.replace(/\bhttps?:\/\/\S+/g, " link ");             // a spoken URL is noise
  t = t.replace(/`([^`]+)`/g, "$1");                        // inline code
  t = t.replace(/(\*\*\*|___)(.+?)\1/g, "$2");              // bold+italic
  t = t.replace(/(\*\*|__)(.+?)\1/g, "$2");                  // bold
  t = t.replace(/(?<![\w*])\*(?!\s)([^*\n]+?)(?<!\s)\*(?![\w*])/g, "$1");  // italic
  t = t.replace(/(?<![\w_])_(?!\s)([^_\n]+?)(?<!\s)_(?![\w_])/g, "$1");
  t = t.replace(/~~(.+?)~~/g, "$1");                        // strikethrough
  t = t.replace(/^\s{0,3}#{1,6}\s+/gm, "");                 // headings
  t = t.replace(/^\s{0,3}>\s?/gm, "");                      // blockquotes
  t = t.replace(/^\s*[-*+]\s+/gm, "");                      // bullets
  t = t.replace(/^\s*\d+\.\s+/gm, "");                      // numbered items keep their text
  t = t.replace(/^\s*\|.*\|\s*$/gm, " ");                   // table rows: unreadable aloud
  t = t.replace(/^\s*[-:|\s]{4,}$/gm, " ");                  // table rules and --- lines
  t = t.replace(/[ \t]{2,}/g, " ");
  return t.replace(/\n{2,}/g, "\n").trim();
}

let speakQueue = "", thinkQueue = "";

// Reasoning is spoken sentence by sentence like the reply, but tagged so the
// synthesiser can give it a different voice.
function speakThinkingStream(delta, flush = false) {
  if (!$("speakThink").checked) return;
  thinkQueue += delta;
  let m;
  while ((m = thinkQueue.match(/^[\s\S]*?[.!?…](\s|$)/))) {
    speak(m[0], "thinking"); thinkQueue = thinkQueue.slice(m[0].length);
  }
  if (flush && thinkQueue.trim()) { speak(thinkQueue, "thinking"); thinkQueue = ""; }
}
// Speak sentence by sentence as the stream arrives, so the reply starts being
// read aloud while it is still being generated.
function speakStreaming(delta, flush = false) {
  speakQueue += delta;
  let m;
  while ((m = speakQueue.match(/^[\s\S]*?[.!?…](\s|$)/))) {
    speak(m[0]); speakQueue = speakQueue.slice(m[0].length);
  }
  if (flush && speakQueue.trim()) { speak(speakQueue); speakQueue = ""; }
}

// --- the turn ---------------------------------------------------------------
async function send(userText, source = "typed") {
  if (busy || !userText.trim()) return;
  busy = true; talkBtn.disabled = true;
  const tag = ($("tagInput").checked && source === "voice") ? "[voice] " : "";
  // The tag goes to the model, not to the transcript on screen: the user knows
  // how they entered it, and echoing the marker back just adds noise.
  addMsg(source === "voice" ? "you 🎤" : "you", userText);
  history.push({ role: "user", content: tag + userText });

  const out = addMsg("bot", "", "partial");
  // Reasoning models (most of what ollama cloud serves) stream a separate
  // `reasoning` field. It is shown, collapsed, but NEVER spoken -- listening to
  // a model deliberate for thirty seconds before it answers is unusable.
  let thinkEl = null;
  let full = "", thinking = "";
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Voicebox-Backend": backendEl.value },
      // Built per request rather than stored in history, so toggling the
      // checkbox takes effect immediately instead of only for new conversations.
      body: JSON.stringify(applyEffort({
        model: modelEl.value, stream: true,
        messages: ($("tagInput").checked && history.some((m) => m.content.startsWith("[voice] ")))
          ? [{ role: "system", content: INPUT_MODE_PREAMBLE }, ...history]
          : history.map((m) => ({ ...m, content: stripTag(m.content) })),
      })),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE frames are separated by a blank line; a chunk can split one.
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const j = JSON.parse(payload);
            const delta = j.choices?.[0]?.delta || {};
            const think = delta.reasoning ?? delta.reasoning_content;
            if (think) {
              thinking += think;
              if (!thinkEl) {
                thinkEl = document.createElement("details");
                thinkEl.className = "think";
                thinkEl.innerHTML = "<summary>thinking…</summary><div></div>";
                out.parentNode.insertBefore(thinkEl, out);
              }
              thinkEl.querySelector("div").textContent = thinking;
              speakThinkingStream(think);
              logEl.scrollTop = logEl.scrollHeight;
            }
            const d = delta.content;
            if (d) {
              // The answer has begun; stop reading the reasoning aloud rather
              // than queueing an aside behind the thing it was preamble to.
              if (!full && thinkQueue) thinkQueue = "";
              full += d;
              if (full.length < 40) full = stripTag(full);   // only ever a prefix
              out.textContent = full;
              out.className = "body";
              if (thinkEl) thinkEl.querySelector("summary").textContent =
                `thought for ${thinking.length} chars`;
              logEl.scrollTop = logEl.scrollHeight;
              speakStreaming(d);   // content only -- reasoning is never spoken
            }
          } catch { /* a partial frame; the next chunk completes it */ }
        }
      }
    }
    speakStreaming("", true);
    history.push({ role: "assistant", content: full });
    status(thinking
      ? `ok — ${full.length} chars (+${thinking.length} thinking, not spoken)`
      : `ok — ${full.length} chars`);
  } catch (e) {
    out.textContent = "⚠ " + e.message;
    out.className = "body";
    status(e.message, "err");
    history.pop();
  } finally {
    busy = false; talkBtn.disabled = false;
  }
}

// --- speech in: engine selection --------------------------------------------
// Chrome's own recogniser is the same Google speech stack behind Gboard's voice
// typing, and since Chrome 139 it can run ON DEVICE, so audio need not leave the
// machine. That is both the best quality available here and the least download:
// the language pack is Chrome's, not ours.
//
// Whisper stays as the portable option -- it works in any browser, and it is the
// only one that keeps working if Chrome's speech service is unavailable.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let webSpeechLocal = false;

async function probeWebSpeech() {
  if (!SR) return null;
  let avail = "unknown";
  try {
    if (typeof SR.available === "function") {
      // Bounded on purpose. This call can simply never settle when the speech
      // service is unreachable, and an unbounded await here hangs the whole boot
      // before the engine list is even built -- the app looks dead over a
      // capability probe that was only ever advisory.
      avail = await Promise.race([
        SR.available({ langs: ["en-US"], processLocally: true }),
        new Promise((r) => setTimeout(() => r("timeout"), 3000)),
      ]);
      webSpeechLocal = avail === "available";
    }
  } catch { /* older Chrome: no static available(); cloud path still works */ }
  return avail;
}

function sttEngine() { return sttEngineEl.value; }

// Web Speech is event-driven and does its own capture, so it does not share the
// MediaRecorder path at all.
function recogniseWebSpeech() {
  return new Promise((resolve, reject) => {
    const r = new SR();
    r.lang = "en-US";
    r.interimResults = true;
    r.continuous = false;
    if ("processLocally" in r) r.processLocally = webSpeechLocal;
    let finalText = "";
    r.onstart = () => status("listening… (speak now)");
    r.onaudiostart = () => console.log("[voicebox] audio capture started");
    r.onspeechstart = () => status("listening… (hearing you)");
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      status("listening… " + (finalText + interim).slice(-60));
    };
    r.onerror = (e) => {
      // These are not interchangeable and the difference is the whole diagnosis:
      // no-speech means the recogniser ran and heard nothing (a mic that is
      // muted, or routed elsewhere); not-allowed is permission; network means
      // the cloud recogniser could not be reached, which on a tailnet-only
      // device is a real possibility.
      const why = {
        "no-speech": "heard nothing — is the mic muted, or picked up by another app?",
        "not-allowed": "microphone permission denied",
        "service-not-allowed": "the browser refused the speech service",
        "audio-capture": "no microphone available",
        "network": "speech service unreachable (needs internet for the cloud recogniser)",
        "aborted": "cancelled",
      }[e.error] || ("speech error: " + e.error);
      console.warn("[voicebox] SpeechRecognition error:", e.error, e);
      reject(new Error(why));
    };
    r.onend = () => resolve(finalText.trim());
    activeRecognition = r;
    r.start();
  });
}
let activeRecognition = null;

async function loadSttEngines() {
  const avail = await probeWebSpeech();
  sttEngineEl.innerHTML = "";
  if (SR) {
    const o = document.createElement("option");
    o.value = "webspeech";
    o.textContent = webSpeechLocal ? "speech: Chrome (on-device)" : "speech: Chrome (cloud)";
    o.title = webSpeechLocal
      ? "Google's recogniser, running locally — audio does not leave this machine"
      : "Google's recogniser via Chrome's service — audio is sent to Google. "
        + "On-device reported: " + avail;
    sttEngineEl.appendChild(o);
  }
  for (const [k, v] of Object.entries(WHISPER)) {
    const o = document.createElement("option");
    o.value = k; o.textContent = "speech: " + v.label;
    sttEngineEl.appendChild(o);
  }
  const saved = localStorage.getItem("vb.stt");
  if (saved && [...sttEngineEl.options].some((o) => o.value === saved)) sttEngineEl.value = saved;
  else sttEngineEl.value = SR ? "webspeech" : "whisper-tiny";
}

sttEngineEl.onchange = async () => {
  localStorage.setItem("vb.stt", sttEngineEl.value);
  if (sttEngine() !== "webspeech") {
    STT_MODEL = WHISPER[sttEngine()].id;
    transcriber = null;             // reloaded lazily at next use
    talkBtn.disabled = true;
    await ensureWhisper();
    talkBtn.disabled = false;
  }
  status("speech engine: " + sttEngineEl.options[sttEngineEl.selectedIndex].textContent);
};

// --- microphone -------------------------------------------------------------
async function initMic() {
  if (!navigator.mediaDevices?.getUserMedia) {
    status("no microphone API — this origin is not a secure context. Use http://localhost, or see README.", "err");
    talkBtn.textContent = "no mic";
    return false;
  }
  try {
    media = await navigator.mediaDevices.getUserMedia({ audio: true });
    return true;
  } catch (e) {
    status("microphone blocked: " + e.message, "err");
    talkBtn.textContent = "no mic";
    return false;
  }
}

async function startRec() {
  if (busy) return;
  stopSpeaking();                       // barge-in: talking over the reply stops it

  if (sttEngine() === "webspeech") {
    talkBtn.classList.add("rec");
    talkBtn.textContent = TOUCH ? "tap when done" : "release to send";
    status("listening…");
    webSpeechPromise = recogniseWebSpeech();
    return;
  }

  if (!media) return;
  chunks = [];
  recorder = new MediaRecorder(media);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.start();
  talkBtn.classList.add("rec");
  talkBtn.textContent = TOUCH ? "tap when done" : "release to send";
  status("listening…");
}

let webSpeechPromise = null;

async function stopRec() {
  if (sttEngine() === "webspeech") {
    talkBtn.classList.remove("rec");
    talkBtn.textContent = TOUCH ? "tap to talk" : "hold to talk";
    if (!webSpeechPromise) return;
    status("finishing…");
    try { activeRecognition?.stop(); } catch { /* already stopping */ }
    try {
      const text = (await webSpeechPromise).trim();
      webSpeechPromise = null;
      if (!text) { status("heard nothing"); return; }
      status("transcribed");
      if ($("autosend").checked) send(text, "voice");
      else { textEl.value = text; status("transcribed — press Enter to send"); }
    } catch (e) {
      webSpeechPromise = null;
      status(e.message, "err");
    }
    return;
  }

  if (!recorder || recorder.state === "inactive") return;
  const done = new Promise((res) => (recorder.onstop = res));
  recorder.stop();
  await done;
  talkBtn.classList.remove("rec");
  talkBtn.textContent = TOUCH ? "tap to talk" : "hold to talk";
  status("transcribing…");

  talkBtn.disabled = true;
  // A stalled transcription used to be indistinguishable from a crashed one.
  // Ticking the elapsed time makes "slow" and "stuck" tell themselves apart.
  const t0 = performance.now();
  const tick = setInterval(
    () => status(`transcribing… ${((performance.now() - t0) / 1000).toFixed(1)}s`), 200);
  try {
    const blob = new Blob(chunks, { type: recorder.mimeType });
    if (!blob.size) throw new Error("recorder produced no audio");
    const buf = await blob.arrayBuffer();

    // Whisper wants 16 kHz mono float32. decodeAudioData resamples into the
    // context's rate, so the context is created at 16 kHz rather than resampling
    // by hand afterwards.
    const ctx = new AudioContext({ sampleRate: 16000 });
    let audio;
    try { audio = await ctx.decodeAudioData(buf); }
    finally { await ctx.close(); }
    const pcm = audio.getChannelData(0);
    if (pcm.length < 1600) throw new Error(`only ${(pcm.length / 16000).toFixed(2)}s of audio — hold or tap for longer`);
    // A silent take is a muted or misrouted mic, not a transcription failure,
    // and the two need different fixes. Peak amplitude tells them apart.
    let peak = 0;
    for (let i = 0; i < pcm.length; i++) { const a = Math.abs(pcm[i]); if (a > peak) peak = a; }
    console.log(`[voicebox] captured ${(pcm.length / 16000).toFixed(2)}s, peak ${peak.toFixed(4)}`);
    if (peak < 0.005) throw new Error(`mic captured ${(pcm.length / 16000).toFixed(1)}s of near-silence (peak ${peak.toFixed(4)}) — muted or another app has it?`);

    await ensureWhisper();
    const out = await transcriber(pcm);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    const text = (out.text || "").trim();
    if (!text) { status(`heard nothing (${secs}s)`); return; }
    status(`transcribed in ${secs}s`);
    if ($("autosend").checked) send(text, "voice");
    else { textEl.value = text; status(`transcribed in ${secs}s — press Enter to send`); }
  } catch (e) {
    console.error("[voicebox] transcription failed:", e);
    status("transcription failed: " + (e.message || e), "err");
  } finally {
    clearInterval(tick);
    if (!busy) talkBtn.disabled = false;
  }
}

// Press-and-hold works with a mouse and is wrong on a phone: a finger that
// drifts off the button cancels the take, and the synthesised mouse events that
// follow a touch re-trigger the handlers. So a coarse pointer gets TAP TO START,
// TAP TO STOP instead, which is also what every phone dictation UI does.
const TOUCH = window.matchMedia("(pointer: coarse)").matches;
let recording = false;

async function beginRec() {
  if (recording || busy) return;
  recording = true;
  await startRec();
}
async function endRec() {
  if (!recording) return;
  recording = false;
  await stopRec();
}

if (TOUCH) {
  talkBtn.addEventListener("click", (e) => {
    e.preventDefault();
    recording ? endRec() : beginRec();
  });
} else {
  talkBtn.addEventListener("mousedown", beginRec);
  talkBtn.addEventListener("mouseup", endRec);
  talkBtn.addEventListener("mouseleave", () => { if (recording) endRec(); });
}

textEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && textEl.value.trim()) { const v = textEl.value; textEl.value = ""; send(v, "typed"); }
});
$("clear").onclick = () => {
  history = []; logEl.innerHTML = ""; stopSpeaking(); setPanel(false); status("cleared");
};
$("speak").onchange = updateCrumb;
ttsEngineEl.addEventListener("change", updateCrumb);

// --- boot -------------------------------------------------------------------
(async () => {
 try {
  await loadBackends();
  const haveMic = await initMic();

  $("speakThink").checked = localStorage.getItem("vb.speakthink") === "1";
  setSpeaking(false);
  $("tagInput").checked = localStorage.getItem("vb.tag") !== "0";
  $("tagInput").onchange = () => localStorage.setItem("vb.tag", $("tagInput").checked ? "1" : "0");
  ttsEngineEl.value = localStorage.getItem("vb.tts") || (SERVER_TTS ? "piper" : "system");
  if (ttsEngineEl.value === "piper" && !SERVER_TTS) ttsEngineEl.value = "system";
  if (ttsEngineEl.value === "piper") loadPiperVoices();
  else if (ttsEngineEl.value === "kokoro") loadKokoroVoices();
  else loadSystemVoices();

  await loadEffort();
  await loadSttEngines();
  if (sttEngine() !== "webspeech") { STT_MODEL = WHISPER[sttEngine()].id; await ensureWhisper(); }

  if (haveMic) { talkBtn.disabled = false; talkBtn.textContent = TOUCH ? "tap to talk" : "hold to talk"; }
  syncThinkVoices();
  updateCrumb();
  status(`ready [build ${BUILD}] — ${sttEngineEl.options[sttEngineEl.selectedIndex]?.textContent || "?"}, chat via ${backendEl.value}`);
 } catch (e) {
  // Never leave the status bar reading "starting" forever. A boot that dies
  // silently is indistinguishable from one that is merely slow, and typing
  // still works, so the page is worth keeping usable even when speech is not.
  console.error("[voicebox] boot failed:", e);
  status("startup failed: " + (e.message || e) + " — typing still works", "err");
  talkBtn.textContent = "speech unavailable";
 }
})();

// ensureWhisper loads (or reloads) the local recogniser for the selected size.
async function ensureWhisper() {
  if (transcriber) return transcriber;
  status("loading speech recogniser (cached after the first run)…");

  // One shared probe for both models -- see pickDevice.
  const device0 = await pickDevice();
  let device = device0;
  if (device === "wasm" && navigator.gpu)
    status("no WebGPU adapter (GPU busy or unavailable) — speech on CPU", "warn");

  const opts = {
    dtype: "q8",
    progress_callback: (p) => {
      if (p.status === "progress" && p.total)
        status(`speech recogniser ${(100 * p.loaded / p.total).toFixed(0)}% (${p.file})`);
    },
  };
  try {
    transcriber = await pipeline("automatic-speech-recognition", STT_MODEL, { device, ...opts });
  } catch (e) {
    // Belt and braces: an adapter can vanish between the probe and the load.
    // whisper-tiny on CPU is genuinely fine -- that is the entire reason this
    // is a 40 MB recogniser and not a 4B multimodal model.
    if (device === "webgpu") {
      status("WebGPU load failed, retrying on CPU: " + e.message, "warn");
      transcriber = await pipeline("automatic-speech-recognition", STT_MODEL, { device: "wasm", ...opts });
      device = "wasm";
    } else throw e;
  }
  return transcriber;
}
</script>
