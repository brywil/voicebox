    const out = await transcriber(pcm);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    const text = (out.text || "").trim();
    if (!text) { status(`heard nothing (${secs}s)`); return; }
    status(`transcribed in ${secs}s`);
    if ($("autosend").checked) send(text, "voice");
    else { textEl.value = text; status(`transcribed in ${secs}s — press Enter to send`); }
  } catch (e) {
    console.error("[voicebox] transcription failed:", e);
    status("transcription failed: " + (e.message || e), "err");
  } finally {
    clearInterval(tick);
    if (!busy) talkBtn.disabled = false;
  }
}

// Press-and-hold works with a mouse and is wrong on a phone: a finger that
// drifts off the button cancels the take, and the synthesised mouse events that
// follow a touch re-trigger the handlers. So a coarse pointer gets TAP TO START,
// TAP TO STOP instead, which is also what every phone dictation UI does.
const TOUCH = window.matchMedia("(pointer: coarse)").matches;
let recording = false;

async function beginRec() {
  if (busy) return;
  // Nothing to record: hand over to the keyboard. There is no API to raise its
  // dictation directly, so the most a page may do is focus the field, which
  // brings up the keyboard with its microphone one tap away.
  if (sttEngine() === "keyboard") {
    textEl.focus();
    status("dictate with the keyboard's mic, then send");
    return;
  }
  if (recording) return;
  recording = true;
  await startRec();
}
async function endRec() {
  if (!recording) return;
  recording = false;
  await stopRec();
}

if (TOUCH) {
  talkBtn.addEventListener("click", (e) => {
    e.preventDefault();
    recording ? endRec() : beginRec();
  });
} else {
  talkBtn.addEventListener("mousedown", beginRec);
  talkBtn.addEventListener("mouseup", endRec);
  talkBtn.addEventListener("mouseleave", () => { if (recording) endRec(); });
}

textEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && textEl.value.trim()) {
    const v = textEl.value;
    textEl.value = "";
    send(v, "typed");
    // In keyboard mode the field IS the interface, so keep it focused: the
    // keyboard stays up and the next turn costs one tap on its microphone
    // rather than a tap on the field and then the microphone. Blurring after
    // every send made a conversation twice the taps it needed to be.
    if (sttEngine() === "keyboard") setTimeout(() => textEl.focus(), 0);
  }
});
$("clear").onclick = async () => {
  stopSpeaking(); setPanel(false);
  // Starts a NEW conversation rather than destroying this one: with a picker, "clear" means
  // "set this aside", and the old conversation stays available. Delete is a separate control
  // for when erasing is actually what is wanted.
  try { await sessionNew(); status("new conversation"); }
  catch { history = []; logEl.innerHTML = ""; status("cleared"); }
};
$("speak").onchange = updateCrumb;
ttsEngineEl.addEventListener("change", updateCrumb);

// --- boot -------------------------------------------------------------------
(async () => {
 try {
  await loadBackends();

  // Default ON when a tool server is configured. Configuring one IS the opt-in;
  // making it off-by-default meant the tools were set up, reachable and working
  // while the model went on saying it had none, with nothing on screen to
  // suggest why. An explicit "0" still turns it off and is remembered.
  $("useTools").checked = SERVER_TOOLS && localStorage.getItem("vb.tools") !== "0";
  $("useTools").onchange = () => {
    localStorage.setItem("vb.tools", $("useTools").checked ? "1" : "0");
    updateCrumb();
  };
  $("speakThink").checked = localStorage.getItem("vb.speakthink") === "1";
  setSpeaking(false);
  $("tagInput").checked = localStorage.getItem("vb.tag") !== "0";
  $("tagInput").onchange = () => localStorage.setItem("vb.tag", $("tagInput").checked ? "1" : "0");
  ttsEngineEl.value = localStorage.getItem("vb.tts") || (SERVER_TTS ? "piper" : "system");
  if (ttsEngineEl.value === "piper" && !SERVER_TTS) ttsEngineEl.value = "system";
  if (ttsEngineEl.value === "piper") loadPiperVoices();
  else if (ttsEngineEl.value === "kokoro") loadKokoroVoices();
  else loadSystemVoices();

  await loadEffort();
  await loadSttEngines();
  // Engine first, THEN whatever that engine needs. Asking for the microphone
  // before knowing the engine prompted for a permission the keyboard mode never
  // uses, and loading Whisper before knowing the engine pulled 40 MB for a
  // recogniser that was not going to run.
  await applySttEngine();
  syncThinkVoices();
  // RESUME. Silent and automatic: a refresh should be invisible, which was the whole point.
  // Any failure here falls back to a fresh session rather than blocking boot -- the page is
  // worth keeping usable even when the store is not.
  try {
    if (sessionId) {
      await sessionLoad(sessionId, { silent: true });
    } else {
      await sessionNew();
    }
    await sessionRefreshList();
  } catch (e) {
    console.warn("[sessions] resume failed:", e);
    try { await sessionNew(); await sessionRefreshList(); }
    catch { status("conversations unavailable — this turn will not be saved", "warn"); }
  }

  updateCrumb();
  const resumed = history.length ? `, resumed ${history.length} turns` : "";
  status(`ready [build ${BUILD}] — ${sttEngineEl.options[sttEngineEl.selectedIndex]?.textContent || "?"}, chat via ${backendEl.value}${resumed}`);
 } catch (e) {
  // Never leave the status bar reading "starting" forever. A boot that dies
  // silently is indistinguishable from one that is merely slow, and typing
  // still works, so the page is worth keeping usable even when speech is not.
  console.error("[voicebox] boot failed:", e);
  status("startup failed: " + (e.message || e) + " — typing still works", "err");
  talkBtn.textContent = "speech unavailable";
 }
})();

// ensureWhisper loads (or reloads) the local recogniser for the selected size.
async function ensureWhisper() {
  if (transcriber) return transcriber;
  status("loading speech recogniser (cached after the first run)…");

  // One shared probe for both models -- see pickDevice.
  const device0 = await pickDevice();
  let device = device0;
  if (device === "wasm" && navigator.gpu)
    status("no WebGPU adapter (GPU busy or unavailable) — speech on CPU", "warn");

  const opts = {
    dtype: "q8",
    progress_callback: (p) => {
      if (p.status === "progress" && p.total)
        status(`speech recogniser ${(100 * p.loaded / p.total).toFixed(0)}% (${p.file})`);
    },
  };
  try {
    transcriber = await pipeline("automatic-speech-recognition", STT_MODEL, { device, ...opts });
  } catch (e) {
    // Belt and braces: an adapter can vanish between the probe and the load.
    // whisper-tiny on CPU is genuinely fine -- that is the entire reason this
    // is a 40 MB recogniser and not a 4B multimodal model.
    if (device === "webgpu") {
      status("WebGPU load failed, retrying on CPU: " + e.message, "warn");
      transcriber = await pipeline("automatic-speech-recognition", STT_MODEL, { device: "wasm", ...opts });
      device = "wasm";
    } else throw e;
  }
  return transcriber;
}
</script>
